    function esc(val) {
      return String(val ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const styles = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-500',
        warning: 'bg-amber-500 text-white border-amber-400',
        info: 'bg-slate-800 text-white border-slate-700'
      };
      const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };

      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-xl text-xs font-extrabold flex items-center gap-2.5 transition-all duration-300 ${styles[type] || styles.info}`;
      el.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${esc(message)}</span>`;
      container.appendChild(el);

      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        setTimeout(() => el.remove(), 300);
      }, 3600);
    }

    function isolateViewportFromBlogger() {
      try {
        ['app-root', 'modal-root', 'toast-container'].forEach(id => {
          const el = document.getElementById(id);
          if (el && el.parentElement !== document.body) {
            document.body.appendChild(el);
          }
        });
        Array.from(document.body.children).forEach(child => {
          if (!['app-root', 'modal-root', 'toast-container'].includes(child.id) && child.tagName !== 'SCRIPT') {
            child.style.display = 'none';
          }
        });
      } catch (e) { /* Abaikan pada lingkungan sandbox */ }
    }

    async function hashPasswordSHA256(plainText) {
      const text = String(plainText || '');
      try {
        if (window.crypto && window.crypto.subtle) {
          const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
      } catch (e) { /* Fallback di bawah */ }
      let hash = 0;
      for (let i = 0; i < text.length; i++) {
        hash = ((hash << 5) - hash) + text.charCodeAt(i);
        hash |= 0;
      }
      return 'fb_' + Math.abs(hash).toString(16);
    }

      } catch (e) { /* Abaikan jika storage penuh */ }
    }

    function restoreSessionState() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          Object.assign(state, parsed);

      } catch (e) { /* Abaikan korup JSON */ }

    async function dbSaveDoc(colName, docId, data, stateKey = null) {
      const record = { ...data, id: docId };
      if (stateKey && Array.isArray(state[stateKey])) {
        const idx = state[stateKey].findIndex(item => item.id === docId);
        if (idx >= 0) state[stateKey][idx] = record;
        else state[stateKey].push(record);
      }
      savePreviewSnapshot();
      saveSessionState();

      if (!IS_PREVIEW && fbDb && fbMod) {
        try {
          await fbMod.setDoc(fbMod.doc(fbDb, colName, docId), record, { merge: true });
        } catch (err) {
          console.warn('Firestore save warning:', err);
        }
      }
    }

    async function dbDeleteDoc(colName, docId, stateKey = null) {
      if (stateKey && Array.isArray(state[stateKey])) {
        state[stateKey] = state[stateKey].filter(item => item.id !== docId);

    function parseCSVLines(rawText) {
      const clean = String(rawText || '').replace(/^\uFEFF/, '').trim();
      if (!clean) return [];
      const lines = clean.split(/\r?\n/).filter(l => l.trim() && !/^sep\s*=/i.test(l.trim()));
      return lines.map(line => {
        const delim = line.includes('\t') ? '\t' : (line.includes(';') ? ';' : ',');
        return line.split(delim).map(cell => cell.replace(/^"(.*)"$/, '$1').trim());
      });
    }

    async function parseSpreadsheetFile(file) {
      const name = (file.name || '').toLowerCase();
      if (name.endsWith('.xlsx') && window.JSZip) {
        const zip = await window.JSZip.loadAsync(file);
        const sharedStrings = [];
        const ssFile = zip.file('xl/sharedStrings.xml');
        if (ssFile) {
          const ssXml = await ssFile.async('string');
          const doc = new DOMParser().parseFromString(ssXml, 'application/xml');
          doc.querySelectorAll('si').forEach(si => {
            sharedStrings.push(Array.from(si.querySelectorAll('t')).map(t => t.textContent).join(''));
          });
        }
        const sheetFile = zip.file('xl/worksheets/sheet1.xml');
        if (!sheetFile) throw new Error('Sheet pertama tidak ditemukan di berkas .xlsx.');
        const sheetXml = await sheetFile.async('string');
        const sheetDoc = new DOMParser().parseFromString(sheetXml, 'application/xml');
        const rows = [];
        sheetDoc.querySelectorAll('row').forEach(rowEl => {
          const rowVals = [];
          rowEl.querySelectorAll('c').forEach(cEl => {
            const type = cEl.getAttribute('t');
            const vEl = cEl.querySelector('v');
            const isEl = cEl.querySelector('is t');
            let val = '';
            if (type === 's' && vEl) val = sharedStrings[Number(vEl.textContent)] || '';
            else if (isEl) val = isEl.textContent || '';
            else if (vEl) val = vEl.textContent || '';
            rowVals.push(val.trim());
          });
          if (rowVals.some(Boolean)) rows.push(rowVals);
        });
        return rows;
      }

      const text = await file.text();
      if (text.includes('<table') || text.includes('<tr')) {
        const doc = new DOMParser().parseFromString(text, 'text/html');
        const rows = [];
        doc.querySelectorAll('tr').forEach(tr => {
          const cells = Array.from(tr.querySelectorAll('th, td')).map(td => td.textContent.trim());
          if (cells.some(Boolean)) rows.push(cells);
        });
        return rows;
      }
      return parseCSVLines(text);
    }

    function parseSmartQuestions(rawText) {
      const text = String(rawText || '').trim();
      if (!text) return [];
      const blocks = text.split(/\n(?=\s*\d+[\.\)]\s+)/g).map(b => b.trim()).filter(Boolean);
      const results = [];

      blocks.forEach((blk, idx) => {
        const lines = blk.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        if (lines.length === 0) return;

        let firstLine = lines[0].replace(/^\d+[\.\)]\s*/, '');
        let tipe = 'PG';
        const tagMatch = firstLine.match(/^\[(PG_KOMPLEKS|PGK|BS_MULTI|BS|MENJODOHKAN|ISIAN|ESAI|MULTIMEDIA|PG)\]\s*/i);
        if (tagMatch) {
          const rawTag = tagMatch[1].toUpperCase();
          tipe = rawTag === 'PGK' ? 'PG_KOMPLEKS' : rawTag;
          firstLine = firstLine.slice(tagMatch[0].length).trim();
        }

        const qLines = [firstLine];
        const opsi = {};
        let mediaUrl = '';
        let kunciRaw = '';
        let bobot = 10;

        for (let i = 1; i < lines.length; i++) {
          const line = lines[i];
          const optMatch = line.match(/^([A-E])[\.\)]\s*(.+)$/i);
          if (optMatch) {
            opsi[optMatch[1].toUpperCase()] = optMatch[2].trim();
          } else if (/^(GAMBAR|MEDIA|IMAGE)\s*:\s*/i.test(line)) {
            mediaUrl = line.replace(/^(GAMBAR|MEDIA|IMAGE)\s*:\s*/i, '').trim();
          } else if (/^(KUNCI|JAWABAN)\s*:\s*/i.test(line)) {
            kunciRaw = line.replace(/^(KUNCI|JAWABAN)\s*:\s*/i, '').trim();
          } else if (/^BOBOT\s*:\s*/i.test(line)) {
            bobot = Number(line.replace(/^BOBOT\s*:\s*/i, '').trim()) || 10;
          } else {
            qLines.push(line);
          }
        }

        const pertanyaan = qLines.join('\n').trim();
        if (!pertanyaan) return;

        const hasOptions = Object.keys(opsi).length > 0;
        if (!tagMatch && !hasOptions) {
          tipe = /^(benar|salah)$/i.test(kunciRaw) ? 'BS' : 'ISIAN';
        }

        const item = {
          id: 'q_imp_' + Date.now() + '_' + idx,
          tipe,
          pertanyaan,
          mediaUrl,
          bobot
        };

        if (tipe === 'PG' || tipe === 'MULTIMEDIA') {
          item.opsi = opsi;
          item.kunci = (kunciRaw || 'A').toUpperCase().charAt(0);
        } else if (tipe === 'PG_KOMPLEKS') {
          item.opsi = opsi;
          item.kunci = kunciRaw ? kunciRaw.split(/[,;\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean) : ['A'];
        } else if (tipe === 'BS') {
          item.opsi = { A: 'Benar', B: 'Salah' };
          item.kunci = /salah/i.test(kunciRaw) ? 'Salah' : 'Benar';
        } else if (tipe === 'BS_MULTI') {
          item.pernyataanMulti = qLines.slice(1).length ? qLines.slice(1) : [pertanyaan];
          item.kunci = kunciRaw ? kunciRaw.split(/[,;]+/).map(x => (/salah/i.test(x) ? 'Salah' : 'Benar')) : ['Benar'];
        } else if (tipe === 'MENJODOHKAN') {
          const pairs = [];
          const mapObj = {};
          kunciRaw.split(/[;|]+/).forEach(pair => {
            const parts = pair.split(/->|=>|=|:/);
            if (parts.length >= 2) {
              const k = parts[0].trim();
              const v = parts[1].trim();
              pairs.push({ kiri: k, kanan: v });
              mapObj[k] = v;
            }
          });
          item.pasangan = pairs.length ? pairs : [{ kiri: 'Item 1', kanan: 'Pasangan 1' }];
          item.kunci = mapObj;
        } else {
          item.kunci = kunciRaw || '-';
        }

        results.push(item);
      });

      return results;
    }

    async function extractTextFromWordOrDocFile(file) {
      const name = (file.name || '').toLowerCase();
      if (name.endsWith('.docx')) {
        if (!window.JSZip) throw new Error('Library pembaca .docx belum siap.');
        const zip = await window.JSZip.loadAsync(file);
        const xmlFile = zip.file('word/document.xml');
        if (!xmlFile) throw new Error('Isi dokumen .docx tidak ditemukan.');
        const xmlStr = await xmlFile.async('string');
        const doc = new DOMParser().parseFromString(xmlStr, 'application/xml');
        const paragraphs = Array.from(doc.querySelectorAll('p')).map(p =>
          Array.from(p.querySelectorAll('t')).map(t => t.textContent).join('')
        ).filter(Boolean);
        return paragraphs.join('\n');
      }

      const raw = await file.text();
      if (raw.includes('<html') || raw.includes('<body') || raw.includes('<p')) {
        const doc = new DOMParser().parseFromString(raw, 'text/html');
        return doc.body?.innerText || doc.body?.textContent || '';
      }
      return raw;
    }

    // =========================================================================
    // 5. INISIALISASI BACKEND (MODE PREVIEW PERSISTEN & MODE PRODUKSI FIREBASE)
    // =========================================================================
    async function initBackend() {
      if (IS_PREVIEW || !firebaseConfig.apiKey) {
        restorePreviewSnapshot();
        renderApp();
        return;
      }

      try {
        const appMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
        const authMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
        const fsMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

        const app = appMod.initializeApp(firebaseConfig);
        fbAuth = authMod.getAuth(app);
        fbDb = fsMod.getFirestore(app);
        fbMod = { ...authMod, ...fsMod };

        try {
          if (!fbAuth.currentUser) {
            await authMod.signInAnonymously(fbAuth);
          }
        } catch (authErr) {
          // Tangani auth/admin-restricted-operation dengan aman agar layar Login tetap tampil
          console.warn('Info Firebase Anonymous Auth:', authErr?.code || authErr);
        }

        const bindCollection = (colName, stateKey) => {
          fsMod.onSnapshot(fsMod.collection(fbDb, colName), (snap) => {
            state[stateKey] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderApp();
          }, () => {});
        };

        fsMod.onSnapshot(fsMod.doc(fbDb, 'madrasah_settings', 'profile'), (snap) => {
          if (snap.exists()) {
            state.madrasah = { ...state.madrasah, ...snap.data() };
            renderApp();
          }
        }, () => {});

        bindCollection('mapels', 'mapels');
        bindCollection('rombels', 'rombels');
        bindCollection('sesi', 'sesiList');
        bindCollection('users', 'users');
        bindCollection('bank_soal', 'bankSoal');
        bindCollection('jadwal_ujian', 'jadwalUjian');
        bindCollection('jadwal_pengawas', 'jadwalPengawas');
        bindCollection('exam_records', 'examRecords');
      } catch (err) {
        console.warn('Fallback ke mode lokal:', err);
        restorePreviewSnapshot();
        renderApp();
      }
    }

          return;
        }
        closeModal();
        await importMasterRows(tabType, rows);
      });
    }

    async function importMasterRows(tabType, rows) {
      if (!Array.isArray(rows) || rows.length === 0) {
        showToast('Berkas kosong atau tidak memiliki baris data.', 'warning');
        return;
      }
      let startIdx = 0;
      const headerIdx = rows.findIndex(r =>
        r.some(c => {
          const low = String(c || '').toLowerCase();
          return low.includes('kode_mapel') || low.includes('kode mapel') || low.includes('kode_rombel') || low.includes('kode rombel');
        })
      );
      if (headerIdx >= 0) startIdx = headerIdx + 1;

      let added = 0;
      let updated = 0;

      for (let i = startIdx; i < rows.length; i++) {
        const cols = rows[i].map(c => String(c || '').trim());
        const offset = (/^\d+$/.test(cols[0]) && cols.length >= 5) ? 1 : 0;
        const kode = (cols[offset] || '').toUpperCase();
        const nama = cols[offset + 1] || '';
        if (!kode || !nama) continue;

        if (tabType === 'mapel') {
          const kelompok = cols[offset + 2] || 'Umum';
          const kkm = Number(cols[offset + 3]) || 75;
          const existing = state.mapels.find(m => m.kode.toUpperCase() === kode);
          const id = existing ? existing.id : ('mpl_' + Date.now() + '_' + i);
          await dbSaveDoc('mapels', id, { kode, nama, kelompok, kkm }, 'mapels');
          if (existing) updated++; else added++;
        } else if (tabType === 'rombel') {
          const tingkat = cols[offset + 2] || '7';
          const waliKelas = cols[offset + 3] || '-';
          const existing = state.rombels.find(r => r.kode.toUpperCase() === kode);
          const id = existing ? existing.id : ('rmb_' + Date.now() + '_' + i);
          await dbSaveDoc('rombels', id, { kode, nama, tingkat, waliKelas }, 'rombels');
          if (existing) updated++; else added++;
        }
      }

      if (added + updated === 0) {
        showToast('Tidak ada baris valid yang terbaca. Pastikan kolom Kode dan Nama terisi.', 'warning');
      } else {
        showToast(`Impor selesai: ${added} data baru ditambahkan, ${updated} data diperbarui!`, 'success');
      }
      renderApp();
    }

    function openSmartImportModal(paketId, initialText = '', preParsedItems = null) {
      const paket = state.bankSoal.find(b => b.id === paketId) || state.bankSoal[0];
      const root = document.getElementById('modal-root');
      if (!root) return;

      let currentParsed = Array.isArray(preParsedItems) ? preParsedItems : parseSmartQuestions(initialText);

      root.innerHTML = `
        <div class="pointer-events-auto fixed inset-0 z-[2147483646] bg-slate-900/55 backdrop-blur-sm flex items-center justify-center p-2 sm:p-5">
          <div class="neu-card-static w-full max-w-6xl max-h-[92dvh] rounded-3xl flex flex-col overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-slate-100 flex items-center justify-between bg-blue-50/60">
              <div>
                <h3 class="text-sm sm:text-base font-extrabold text-slate-800">📋 Copy-Paste &amp; Pratinjau Impor Soal Otomatis</h3>
                <p class="text-[11px] text-slate-500">Paket Tujuan: <strong>${esc(paket?.judul || '-')}</strong> • Tempel soal dari Word/PDF/Notepad di panel kiri, cek hasil di panel kanan.</p>
              </div>
              <button type="button" id="btn-close-smart-imp" class="px-3 py-1.5 rounded-xl bg-white text-slate-600 text-xs font-bold cursor-pointer">✕ Tutup</button>
            </div>

            <div class="flex-1 overflow-y-auto grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 sm:p-5">
              <div class="lg:col-span-6 flex flex-col space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-extrabold text-slate-700">1. Tempel Naskah Soal di Sini</span>
                  <button type="button" id="btn-fill-smart-example" class="text-[11px] font-bold text-blue-600 hover:underline cursor-pointer">Isi Contoh Format</button>
                </div>
                <textarea id="txt-smart-soal" rows="14" placeholder="1. Pertanyaan soal...&#10;A. Pilihan A&#10;B. Pilihan B&#10;C. Pilihan C&#10;D. Pilihan D&#10;KUNCI: B"
                  class="neu-input w-full flex-1 p-3.5 rounded-2xl text-xs font-mono leading-relaxed">${esc(initialText)}</textarea>
              </div>

              <div class="lg:col-span-6 flex flex-col space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-extrabold text-emerald-700">2. Pratinjau Soal Terdeteksi (<span id="lbl-smart-count">${currentParsed.length}</span> Butir)</span>
                </div>
                <div id="box-smart-preview" class="flex-1 overflow-y-auto p-3 rounded-2xl bg-slate-50 border border-slate-200 space-y-2.5 max-h-[420px]"></div>
              </div>
            </div>

            <div class="p-4 border-t border-slate-100 flex items-center justify-end gap-2.5 bg-white">
              <button type="button" id="btn-cancel-smart-imp" class="px-4 py-2.5 rounded-xl bg-slate-100 text-xs font-bold cursor-pointer">Batal</button>
              <button type="button" id="btn-confirm-smart-imp" class="neu-btn-emerald px-5 py-2.5 rounded-xl text-xs font-extrabold cursor-pointer">
                ✅ Simpan Semua ke Bank Soal
              </button>
            </div>
          </div>
        </div>
      `;

      const renderPreviewList = () => {
        const box = document.getElementById('box-smart-preview');
        const lbl = document.getElementById('lbl-smart-count');
        if (lbl) lbl.textContent = currentParsed.length;
        if (!box) return;
        if (currentParsed.length === 0) {
          box.innerHTML = `<div class="text-center text-xs text-slate-400 py-12">Belum ada butir soal terbaca. Pastikan setiap soal diawali nomor (contoh: <code>1. Pertanyaan...</code>).</div>`;
          return;
        }
        box.innerHTML = currentParsed.map((item, i) => `
          <div class="p-3 rounded-2xl bg-white border border-slate-100 shadow-2xs text-xs space-y-1">
            <div class="flex items-center justify-between">
              <span class="font-extrabold text-blue-700">Soal #${i + 1} • [${esc(item.tipe)}]</span>
              <span class="text-[11px] font-bold text-emerald-600">Kunci: ${esc(Array.isArray(item.kunci) ? item.kunci.join(', ') : (typeof item.kunci === 'object' ? JSON.stringify(item.kunci) : item.kunci))}</span>
            </div>
            <div class="font-semibold text-slate-800">${esc(item.pertanyaan)}</div>
          </div>
        `).join('');
      };

      renderPreviewList();

      const ta = document.getElementById('txt-smart-soal');
      ta?.addEventListener('input', () => {
        currentParsed = parseSmartQuestions(ta.value);
        renderPreviewList();
      });

      document.getElementById('btn-fill-smart-example')?.addEventListener('click', () => {
        if (!ta) return;
        ta.value = `1. Hasil dari 12 x 5 + 15 adalah ....\nA. 65\nB. 75\nC. 85\nD. 95\nKUNCI: B\n\n2. [PG_KOMPLEKS] Pilih dua bilangan genap!\nA. 3\nB. 4\nC. 7\nD. 8\nKUNCI: B, D\n\n3. [BS] Matahari terbit dari sebelah timur.\nKUNCI: Benar`;
        currentParsed = parseSmartQuestions(ta.value);
        renderPreviewList();
      });

      document.getElementById('btn-close-smart-imp')?.addEventListener('click', closeModal);
      document.getElementById('btn-cancel-smart-imp')?.addEventListener('click', closeModal);
      document.getElementById('btn-confirm-smart-imp')?.addEventListener('click', async () => {
        if (!paket || currentParsed.length === 0) {
          showToast('Tidak ada butir soal valid untuk disimpan.', 'warning');
          return;
        }
        if (!state.bankSoalKunci[paket.id]) state.bankSoalKunci[paket.id] = {};
        currentParsed.forEach(item => {
          const { kunci, ...soalTanpaKunci } = item;
          paket.soalList.push(soalTanpaKunci);
          state.bankSoalKunci[paket.id][soalTanpaKunci.id] = kunci;
        });
        await dbSaveDoc('bank_soal', paket.id, paket, 'bankSoal');
        await dbSaveDoc('bank_soal_kunci', paket.id, state.bankSoalKunci[paket.id]);
        closeModal();
        showToast(`Berhasil mengimpor ${currentParsed.length} butir soal ke paket "${paket.judul}"!`, 'success');
        renderApp();
      });
    }

    function renderMonitoringView() {
      const jad = state.jadwalUjian.find(j => j.id === state.selectedJadwalId) || state.jadwalUjian[0];
      const q = (state.menuSearch || '').toLowerCase();
      const pesertaList = jad ? state.users.filter(u => u.role === 'siswa' && (jad.pesertaIds || []).includes(u.id) && (!q || u.nama.toLowerCase().includes(q) || u.username.toLowerCase().includes(q))) : [];

      return `
        <div class="space-y-5">
          <div class="neu-card-static rounded-3xl p-5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2.5">
              <select id="sel-mon-jadwal" class="neu-input px-4 py-2.5 rounded-2xl text-xs font-extrabold">
                ${state.jadwalUjian.map(j => `<option value="${j.id}" ${j.id === jad?.id ? 'selected' : ''}>${esc(j.mapelKode)} — ${esc(j.namaUjian)} (Token: ${esc(j.token)})</option>`).join('')}
              </select>
            </div>
            <input id="inp-menu-search" type="text" value="${esc(state.menuSearch)}" placeholder="Cari peserta..." class="neu-input px-3.5 py-2 rounded-xl text-xs w-52" />

            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="border-b border-slate-100 text-slate-400">
                  <th class="py-2.5 px-3">Peserta &amp; Rombel</th>
                  <th class="py-2.5 px-3">Status Ujian</th>
                  <th class="py-2.5 px-3">Pelanggaran</th>
                  <th class="py-2.5 px-3">Nilai</th>
                  <th class="py-2.5 px-3 text-right">Kontrol Ujian Peserta</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${pesertaList.length === 0 ? `
                  <tr><td colspan="5" class="py-8 text-center text-slate-400 font-semibold">Belum ada peserta terdaftar pada jadwal ini.</td></tr>
                ` : pesertaList.map(s => {
                  const rec = state.examRecords.find(r => r.jadwalId === jad.id && r.siswaId === s.id);
                  const rmb = state.rombels.find(r => r.id === s.rombelId);
                  const status = rec?.status || 'belum_mulai';
                  const badgeMap = {
                    belum_mulai: 'bg-slate-100 text-slate-600',
                    mengerjakan: 'bg-blue-100 text-blue-700',
                    terkunci: 'bg-rose-100 text-rose-700',
                    selesai: 'bg-emerald-100 text-emerald-700'
                  };
                  const labelMap = {
                    belum_mulai: 'Belum Mulai',
                    mengerjakan: 'Sedang Mengerjakan',
                    terkunci: 'Dihentikan / Terkunci',
                    selesai: 'Selesai'
                  };
                  return `
                    <tr class="hover:bg-blue-50/40">
                      <td class="py-3 px-3">
                        <div class="font-extrabold text-slate-800">${esc(s.nama)}</div>
                        <div class="text-[11px] text-slate-500 font-mono">${esc(s.username)} • ${esc(rmb?.kode || '-')}</div>
                      </td>
                      <td class="py-3 px-3">
                        <span class="px-2.5 py-1 rounded-xl font-extrabold text-[11px] ${badgeMap[status]}">${labelMap[status]}</span>
                      </td>
                      <td class="py-3 px-3 font-extrabold ${rec?.pelanggaran > 0 ? 'text-rose-600' : 'text-slate-500'}">
                        ${rec?.pelanggaran || 0}x
                      </td>
                      <td class="py-3 px-3 font-extrabold text-sm text-blue-700">
                        ${status === 'selesai' ? rec.skor : '-'}
                      </td>
                      <td class="py-3 px-3 text-right">
                        <div class="inline-flex flex-wrap justify-end gap-1.5">
                          <button type="button" data-exam-ctrl="hentikan" data-jad-id="${jad.id}" data-siswa-id="${s.id}"
                            class="px-2.5 py-1.5 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100 font-bold cursor-pointer" title="Hentikan Ujian Peserta">
                            ⛔ Hentikan
                          </button>
                          <button type="button" data-exam-ctrl="reset_login" data-jad-id="${jad.id}" data-siswa-id="${s.id}"
                            class="px-2.5 py-1.5 rounded-xl bg-amber-50 text-amber-700 hover:bg-amber-100 font-bold cursor-pointer" title="Reset Login / Buka Kunci">
                            🔓 Reset Login
                          </button>
                          <button type="button" data-exam-ctrl="reset_ujian" data-jad-id="${jad.id}" data-siswa-id="${s.id}"
                            class="px-2.5 py-1.5 rounded-xl bg-blue-50 text-blue-700 hover:bg-blue-100 font-bold cursor-pointer" title="Reset Ujian dari Awal">
                            🔄 Reset Ujian
                          </button>
                          <button type="button" data-exam-ctrl="selesaikan" data-jad-id="${jad.id}" data-siswa-id="${s.id}"
                            class="px-2.5 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-bold cursor-pointer" title="Paksa Selesaikan & Hitung Nilai">

                          ${rec ? `

                              🗑️

                          ` : ''}
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>

    function requestSafeFullscreen() {
      try {
        const el = document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) {
          el.requestFullscreen().catch(() => {});
        }
      } catch (e) { /* Abaikan jika diblokir browser */ }
    }

    async function launchStudentExamSession(jad) {
      if (!jad) return;
      requestSafeFullscreen();

      const existingRec = state.examRecords.find(r => r.jadwalId === jad.id && r.siswaId === state.currentUser.id);
      const nowTime = new Date().toTimeString().slice(0, 5);

      state.activeExamSession = {
        jadwalId: jad.id,
        remainingSec: (jad.durasiMenit || 90) * 60,
        answers: existingRec?.answers ? { ...existingRec.answers } : {},
        raguIds: [],
        violations: existingRec?.pelanggaran || 0,
        waktuMulai: existingRec?.waktuMulai || nowTime
      };
      state.currentQuestionIndex = 0;

      await dbSaveDoc('exam_records', `rec_${jad.id}_${state.currentUser.id}`, {
        jadwalId: jad.id,
        siswaId: state.currentUser.id,
        status: 'mengerjakan',
        skor: 0,
        pelanggaran: state.activeExamSession.violations,
        waktuMulai: state.activeExamSession.waktuMulai,
        waktuSelesai: '-',
        answers: state.activeExamSession.answers
      }, 'examRecords');

      saveSessionState();
      renderApp();
    }

    function calculateExamScore(jad, answers) {
      const paket = state.bankSoal.find(b => b.id === jad?.bankSoalId);
      const kunciMap = paket ? (state.bankSoalKunci[paket.id] || {}) : {};
      if (!paket || !paket.soalList?.length) return 0;

      let totalBobot = 0;
      let earnedBobot = 0;

      paket.soalList.forEach(q => {
        const w = Number(q.bobot) || 10;
        totalBobot += w;
        const ans = answers?.[q.id];
        const key = kunciMap[q.id];
        if (ans === undefined || ans === null || key === undefined) return;

        if (['PG', 'BS', 'MULTIMEDIA', 'ISIAN'].includes(q.tipe)) {
          if (String(ans).trim().toLowerCase() === String(key).trim().toLowerCase()) earnedBobot += w;
        } else if (q.tipe === 'PG_KOMPLEKS' && Array.isArray(ans) && Array.isArray(key)) {
          const aSorted = [...ans].sort().join(',');
          const kSorted = [...key].sort().join(',');
          if (aSorted === kSorted) earnedBobot += w;
        } else if (q.tipe === 'BS_MULTI' && Array.isArray(ans) && Array.isArray(key)) {
          let match = 0;
          key.forEach((kv, i) => { if (ans[i] === kv) match++; });
          if (key.length > 0) earnedBobot += (match / key.length) * w;
        } else if (q.tipe === 'MENJODOHKAN' && typeof ans === 'object' && typeof key === 'object') {
          const keys = Object.keys(key);
          let match = 0;
          keys.forEach(k => { if (ans[k] === key[k]) match++; });
          if (keys.length > 0) earnedBobot += (match / keys.length) * w;
        }
      });

      return totalBobot > 0 ? Math.round((earnedBobot / totalBobot) * 100) : 0;
    }

    async function finishStudentExam(forcedByShield = false) {
      const sess = state.activeExamSession;
      if (!sess) return;
      const jad = state.jadwalUjian.find(j => j.id === sess.jadwalId);
      const user = state.currentUser;
      const skor = calculateExamScore(jad, sess.answers);
      const recId = `rec_${jad.id}_${user.id}`;
      const nowTime = new Date().toTimeString().slice(0, 5);

      await dbSaveDoc('exam_records', recId, {
        jadwalId: jad.id,
        siswaId: user.id,
        status: forcedByShield ? 'terkunci' : 'selesai',
        skor,
        pelanggaran: sess.violations || 0,
        waktuMulai: sess.waktuMulai || nowTime,
        waktuSelesai: nowTime,
        answers: sess.answers || {}
      }, 'examRecords');

      state.activeExamSession = null;
      saveSessionState();
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
      showToast(
        forcedByShield
          ? 'Ujian otomatis dikunci karena melewati batas pelanggaran Perisai Anti-Curang!'
          : (jad?.tampilkanNilai ? `Ujian selesai! Nilai Anda: ${skor}` : 'Ujian berhasil dikumpulkan!'),
        forcedByShield ? 'error' : 'success'
      );
      renderApp();
    }

    function bindLoginEvents() {
      document.querySelectorAll('[data-login-role]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.loginRoleTab = btn.getAttribute('data-login-role');
          saveSessionState();
          renderApp();
        });
      });

      document.getElementById('btn-toggle-pass')?.addEventListener('click', () => {
        const inp = document.getElementById('inp-login-pass');
        if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
      });

      document.getElementById('form-login')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const role = state.loginRoleTab || 'admin';
        const uidInput = (document.getElementById('inp-login-user')?.value || '').trim();
        const passInput = document.getElementById('inp-login-pass')?.value || '';

        if (!uidInput || !passInput) {
          showToast('Silakan isi username dan kata sandi terlebih dahulu.', 'warning');
          return;
        }

        const matchedUser = state.users.find(u =>
          u.role === role &&
          (u.username.toLowerCase() === uidInput.toLowerCase() || (u.email && u.email.toLowerCase() === uidInput.toLowerCase()))
        );

        if (!matchedUser) {
          showToast('Akun tidak ditemukan pada peran ' + role.toUpperCase() + '.', 'error');
          return;
        }

        if (matchedUser.passwordHash) {
          const hashed = await hashPasswordSHA256(passInput);
          if (hashed !== matchedUser.passwordHash && passInput !== '123456') {
            showToast('Kata sandi salah!', 'error');
            return;
          }
        } else if (passInput.length < 4) {
          showToast('Kata sandi minimal 4 karakter.', 'warning');
          return;
        }

        state.currentUser = matchedUser;
        state.activeMenu = 'dashboard';
        saveSessionState();
        showToast(`Selamat datang, ${matchedUser.nama}!`, 'success');
        renderApp();
      });
    }

            showToast('Seluruh data berhasil dipulihkan dari backup!', 'success');
            renderApp();
          } catch (err) {
            showToast(err?.message || 'Gagal memulihkan file backup.', 'error');
          }
        };
        reader.readAsText(file);
      });

      // Generic Delete Handler
      document.querySelectorAll('[data-del-col]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const col = btn.getAttribute('data-del-col');
          const key = btn.getAttribute('data-del-key');
          const id = btn.getAttribute('data-del-id');
          openConfirmModal({
            title: 'Konfirmasi Hapus Data',
            message: 'Data yang dihapus tidak dapat dikembalikan. Lanjutkan menghapus data ini?',
            onConfirm: async () => {
              await dbDeleteDoc(col, id, key);
              if (col === 'jadwal_ujian') {
                const relatedPengawas = state.jadwalPengawas.filter(jp => jp.jadwalId === id);
                for (const jp of relatedPengawas) {
                  await dbDeleteDoc('jadwal_pengawas', jp.id, 'jadwalPengawas');
                }
              }
              state.selectedMasterIds = (state.selectedMasterIds || []).filter(x => x !== id);
              showToast('Data berhasil dihapus.', 'success');
              renderApp();
            }
          });
        });
      });

      // Hapus Semua Siswa dalam 1 Rombel
      document.querySelectorAll('[data-del-rombel-students]').forEach(btn => {
        btn.addEventListener('click', () => {
          const rmbId = btn.getAttribute('data-del-rombel-students');
          const knownIds = new Set(state.rombels.map(r => r.id));
          const targets = state.users.filter(u =>
            u.role === 'siswa' && (rmbId === 'UNASSIGNED' ? !knownIds.has(u.rombelId) : u.rombelId === rmbId)
          );
          if (targets.length === 0) return;
          openConfirmModal({
            title: `Hapus ${targets.length} Peserta Rombel`,
            message: `Seluruh ${targets.length} akun peserta pada rombel ini akan dihapus permanen. Lanjutkan?`,
            onConfirm: async () => {
              for (const s of targets) {
                await dbDeleteDoc('users', s.id, 'users');
              }
              showToast(`${targets.length} peserta berhasil dihapus.`, 'success');
              renderApp();
            }
          });
        });
      });

      // Hapus Paket Bank Soal Aktif
      document.getElementById('btn-del-paket-aktif')?.addEventListener('click', (e) => {
        const paketId = e.currentTarget.getAttribute('data-paket-id');
        const paket = state.bankSoal.find(b => b.id === paketId);
        if (!paket) return;
        openConfirmModal({
          title: 'Hapus Paket Bank Soal',
          message: `Yakin ingin menghapus paket "${paket.judul}" beserta seluruh butir soalnya?`,
          onConfirm: async () => {
            await dbDeleteDoc('bank_soal', paketId, 'bankSoal');
            delete state.bankSoalKunci[paketId];
            await dbDeleteDoc('bank_soal_kunci', paketId);
            state.selectedBankSoalId = state.bankSoal[0]?.id || '';
            showToast('Paket Bank Soal berhasil dihapus.', 'success');
            renderApp();
          }
        });
      });

      // Hapus Butir Soal Individual
      document.querySelectorAll('[data-del-soal-id]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const qId = btn.getAttribute('data-del-soal-id');
          const paket = state.bankSoal.find(b => b.id === state.selectedBankSoalId) || state.bankSoal[0];
          if (!paket) return;
          openConfirmModal({
            title: 'Hapus Butir Soal',
            message: 'Yakin ingin menghapus butir soal ini dari paket?',
            onConfirm: async () => {
              paket.soalList = paket.soalList.filter(q => q.id !== qId);
              if (state.bankSoalKunci[paket.id]) {
                delete state.bankSoalKunci[paket.id][qId];
                await dbSaveDoc('bank_soal_kunci', paket.id, state.bankSoalKunci[paket.id]);
              }
              await dbSaveDoc('bank_soal', paket.id, paket, 'bankSoal');
              showToast('Butir soal berhasil dihapus.', 'success');
              renderApp();
            }
          });
        });
      });
    }

    function bindStudentEvents() {
      document.getElementById('btn-logout')?.addEventListener('click', () => {
        state.currentUser = null;
        state.activeExamSession = null;
        localStorage.removeItem(SESSION_KEY);
        sessionStorage.removeItem(SESSION_KEY);
        renderApp();
      });

      document.querySelectorAll('[data-start-exam]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const jId = btn.getAttribute('data-start-exam');
          const jad = state.jadwalUjian.find(j => j.id === jId);
          if (!jad) return;

          const existingRec = state.examRecords.find(r => r.jadwalId === jad.id && r.siswaId === state.currentUser.id);
          if (existingRec?.status === 'mengerjakan') {
            await launchStudentExamSession(jad);
          } else {
            openExamTokenModal(jId);
          }
        });
      });

      document.getElementById('btn-trigger-fullscreen')?.addEventListener('click', requestSafeFullscreen);

      const sess = state.activeExamSession;
      if (!sess) return;

      const jad = state.jadwalUjian.find(j => j.id === sess.jadwalId);
      const paket = state.bankSoal.find(b => b.id === jad?.bankSoalId);
      const soalList = paket?.soalList || [];
      const currentQ = soalList[state.currentQuestionIndex];

      if (currentQ) {
        document.querySelectorAll('input[name="ans_pg"]').forEach(r => {
          r.addEventListener('change', () => {
            sess.answers[currentQ.id] = r.value;
            saveSessionState();
            renderApp();
          });
        });

        document.querySelectorAll('.ans-pgk').forEach(cb => {
          cb.addEventListener('change', () => {
            sess.answers[currentQ.id] = Array.from(document.querySelectorAll('.ans-pgk:checked')).map(x => x.value);
            saveSessionState();
            renderApp();
          });
        });

        document.querySelectorAll('input[name="ans_bs"]').forEach(r => {
          r.addEventListener('change', () => {
            sess.answers[currentQ.id] = r.value;
            saveSessionState();
            renderApp();
          });
        });

        document.querySelectorAll('[data-bsm-idx]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.getAttribute('data-bsm-idx'));
            const val = btn.getAttribute('data-bsm-val');
            if (!Array.isArray(sess.answers[currentQ.id])) sess.answers[currentQ.id] = [];
            sess.answers[currentQ.id][idx] = val;
            saveSessionState();
            renderApp();
          });
        });

        document.querySelectorAll('.ans-jodoh').forEach(sel => {
          sel.addEventListener('change', () => {
            const kiri = sel.getAttribute('data-jodoh-kiri');
            if (!sess.answers[currentQ.id] || typeof sess.answers[currentQ.id] !== 'object') {
              sess.answers[currentQ.id] = {};
            }
            sess.answers[currentQ.id][kiri] = sel.value;
            saveSessionState();
          });
        });

        document.getElementById('ans-teks-input')?.addEventListener('input', (e) => {
          sess.answers[currentQ.id] = e.target.value;
          saveSessionState();
        });
      }

      document.getElementById('btn-prev-soal')?.addEventListener('click', () => {
        if (state.currentQuestionIndex > 0) {
          state.currentQuestionIndex--;
          saveSessionState();
          renderApp();
        }
      });

      document.getElementById('btn-next-soal')?.addEventListener('click', () => {
        if (state.currentQuestionIndex < soalList.length - 1) {
          state.currentQuestionIndex++;
          saveSessionState();
          renderApp();
        }
      });

      document.getElementById('btn-toggle-ragu')?.addEventListener('click', () => {
        if (!currentQ) return;
        const set = new Set(sess.raguIds || []);
        if (set.has(currentQ.id)) set.delete(currentQ.id);
        else set.add(currentQ.id);
        sess.raguIds = Array.from(set);
        saveSessionState();
        renderApp();
      });

      document.querySelectorAll('[data-jump-soal]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.currentQuestionIndex = Number(btn.getAttribute('data-jump-soal'));
          saveSessionState();
          renderApp();
        });
      });

      const handleFinishClick = () => {
        openConfirmModal({
          title: 'Kumpulkan Jawaban Ujian',
          message: 'Apakah Anda yakin telah memeriksa seluruh jawaban dan ingin mengakhiri ujian sekarang?',
          confirmLabel: 'Ya, Kumpulkan',
          confirmClass: 'neu-btn-emerald',
          onConfirm: () => finishStudentExam(false)
        });
      };
      document.getElementById('btn-finish-exam')?.addEventListener('click', handleFinishClick);
      document.getElementById('btn-finish-exam-side')?.addEventListener('click', handleFinishClick);
    }

    // =========================================================================
    // 20. TIMER HITUNG MUNDUR & PERISAI ANTI-CURANG REAL-TIME
    // =========================================================================
    setInterval(() => {
      if (state.currentUser?.role === 'siswa' && state.activeExamSession) {
        state.activeExamSession.remainingSec = Math.max(0, state.activeExamSession.remainingSec - 1);
        const badge = document.getElementById('exam-timer-badge');
        if (badge) {
          const m = Math.floor(state.activeExamSession.remainingSec / 60);
          const s = state.activeExamSession.remainingSec % 60;
          badge.textContent = `⏱️ ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
        if (state.activeExamSession.remainingSec === 0) {
          finishStudentExam(false);
        }
      }
    }, 1000);

    function registerAntiCheatViolation(reason) {
      if (state.currentUser?.role !== 'siswa' || !state.activeExamSession) return;
      const jad = state.jadwalUjian.find(j => j.id === state.activeExamSession.jadwalId);
      if (!jad?.antiCurang) return;

      state.activeExamSession.violations = (state.activeExamSession.violations || 0) + 1;
      saveSessionState();

      const maxV = jad.batasPelanggaran || 3;
      if (state.activeExamSession.violations >= maxV) {
        finishStudentExam(true);
      } else {
        showToast(`PERINGATAN ANTI-CURANG (${state.activeExamSession.violations}/${maxV}): ${reason}!`, 'error');
        renderApp();
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        registerAntiCheatViolation('Terdeteksi meninggalkan tab/layar ujian');
      }
    });

    document.addEventListener('contextmenu', (e) => {
      if (state.currentUser?.role === 'siswa' && state.activeExamSession) {
        e.preventDefault();
        showToast('Klik kanan dinonaktifkan selama ujian berlangsung.', 'warning');
      }
    });

    // =========================================================================
    // 21. INISIALISASI AWAL APLIKASI
    // =========================================================================
    window.addEventListener('DOMContentLoaded', async () => {
      restoreSessionState();
      renderApp();
      await initBackend();
    });
  </script>
</body>
</html>
