          selectedPesertaIdsForJadwal: state.selectedPesertaIdsForJadwal
        };
        localStorage.setItem(DATA_KEY, JSON.stringify(dataPayload));
      } catch (e) { /* Abaikan kuota penuh */ }
    }

    function restoreSessionState() {
      try {
        const rawData = localStorage.getItem(DATA_KEY);
        if (rawData && IS_PREVIEW) {
          const parsedData = JSON.parse(rawData);
          Object.assign(state, parsedData);
        }
        const rawSession = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
        if (rawSession) {
          const parsedSession = JSON.parse(rawSession);
          Object.assign(state, parsedSession);
        }
      } catch (e) { /* Gunakan state bawaan jika rusak */ }
    }

    // =========================================================================
    // 5. UTILITAS KEAMANAN, ENKRIPSI SHA-256, TOAST & MODAL KONFIRMASI
    // =========================================================================
    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function hashPasswordSHA256(plainText) {
      const text = String(plainText || '');
      if (window.crypto && window.crypto.subtle) {
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      return 'sha256_fallback_' + btoa(unescape(encodeURIComponent(text)));
    }

      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl border shadow-xl text-xs font-bold transition-all duration-300 ${colors[type] || colors.info}`;

    async function initBackend() {
      if (IS_PREVIEW) return;
      try {
        const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
        const { getAuth, signInAnonymously } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
        const { getFirestore, collection, doc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

        const app = initializeApp(firebaseConfig);
        fbAuth = getAuth(app);
        fbDb = getFirestore(app);

        // Dengarkan identitas madrasah publik agar logo tampil sebelum login
        onSnapshot(doc(fbDb, 'madrasah_settings', 'profile'), (snap) => {
          if (snap.exists()) {
            state.madrasah = { ...state.madrasah, ...snap.data() };
            renderApp();
          }
        }, () => {});

        try {
          await signInAnonymously(fbAuth);
        } catch (authErr) {
          // Tangani auth/admin-restricted-operation dengan aman agar halaman Login tetap muncul
          console.warn('Info Autentikasi Awal:', authErr?.code || authErr?.message);
        }

        if (fbAuth.currentUser) {
          attachFirestoreListeners(collection, doc, onSnapshot);
        }
      } catch (err) {
        console.error('Gagal menginisialisasi Firebase:', err);
        showToast('Gagal terhubung ke server Firebase. Periksa konfigurasi jaringan.', 'error');
      }
    }

    function attachFirestoreListeners(collection, doc, onSnapshot) {
      firestoreUnsubscribers.forEach(unsub => unsub());
      firestoreUnsubscribers = [];
      const bindCol = (colName, stateKey) => {
        firestoreUnsubscribers.push(
          onSnapshot(collection(fbDb, colName), (qs) => {
            const list = [];
            qs.forEach(d => list.push({ id: d.id, ...d.data() }));
            state[stateKey] = list;
            renderApp();
          }, () => {})
        );
      };
      bindCol('mapels', 'mapels');
      bindCol('rombels', 'rombels');
      bindCol('sesi', 'sesiList');
      bindCol('users', 'users');
      bindCol('bank_soal', 'bankSoal');
      bindCol('jadwal_ujian', 'jadwalUjian');
      bindCol('jadwal_pengawas', 'jadwalPengawas');
      bindCol('exam_records', 'examRecords');

      firestoreUnsubscribers.push(
        onSnapshot(collection(fbDb, 'bank_soal_kunci'), (qs) => {
          const map = {};
          qs.forEach(d => { map[d.id] = d.data(); });
          state.bankSoalKunci = map;
        }, () => {})
      );
    }

    async function dbSaveDoc(colName, docId, payload, stateKey = null) {
      if (stateKey && Array.isArray(state[stateKey])) {
        const idx = state[stateKey].findIndex(item => item.id === docId);
        const record = { id: docId, ...payload };
        if (idx >= 0) state[stateKey][idx] = record;
        else state[stateKey].push(record);
      }
      if (IS_PREVIEW) {
        savePreviewSnapshot();
      } else if (fbDb) {
        try {
          const { doc, setDoc } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
          await setDoc(doc(fbDb, colName, docId), payload, { merge: true });
        } catch (err) {
          showToast('Gagal menyimpan ke server: ' + (err?.message || 'Periksa izin akses.'), 'error');
        }
      }
    }

    async function dbDeleteDoc(colName, docId, stateKey = null) {
      if (stateKey && Array.isArray(state[stateKey])) {
        state[stateKey] = state[stateKey].filter(item => item.id !== docId);

      if (IS_PREVIEW) {
        savePreviewSnapshot();

        } catch (err) {
          showToast('Gagal menghapus di server: ' + (err?.message || 'Periksa izin akses.'), 'error');
        }
      }
    }

    function downloadCSV(filename, headers, rows) {
      const sep = ';';
      const escapeCell = (val) => {
        const s = String(val ?? '');
        return (s.includes(sep) || s.includes('"') || s.includes('\n')) ? `"${s.replace(/"/g, '""')}"` : s;
      };
      const lines = ['sep=;', headers.map(escapeCell).join(sep), ...rows.map(r => r.map(escapeCell).join(sep))];
      const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(`Template CSV "${filename}" berhasil diunduh.`, 'success');
    }

    function parseCSVLines(text) {
      let clean = text.replace(/^\uFEFF/, '').trim();
      if (!clean) return [];
      const rawLines = clean.split(/\r?\n/).filter(l => l.trim() !== '');
      if (rawLines.length > 0 && /^sep\s*=\s*[;,\t]$/i.test(rawLines[0].trim())) {
        rawLines.shift();
      }
      if (rawLines.length === 0) return [];
      const sampleLine = rawLines[0];
      const semiCount = sampleLine.split(';').length;
      const commaCount = sampleLine.split(',').length;
      const tabCount = sampleLine.split('\t').length;
      const sep = tabCount > semiCount && tabCount > commaCount ? '\t' : (semiCount >= commaCount ? ';' : ',');

      return rawLines.map(line => {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i + 1] === '"') {
              cur += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === sep && !inQuotes) {
            result.push(cur.trim());
            cur = '';
          } else {
            cur += ch;
          }
        }
        result.push(cur.trim());
        return result;
      });
    }

    async function parseXlsxBuffer(buffer) {
      if (!window.JSZip) throw new Error('Pustaka pembaca .xlsx belum siap. Gunakan format .xls atau .csv.');
      const zip = await window.JSZip.loadAsync(buffer);
      const sharedStrings = [];
      const ssFile = zip.file('xl/sharedStrings.xml');
      if (ssFile) {
        const ssXml = await ssFile.async('string');
        const ssDoc = new DOMParser().parseFromString(ssXml, 'application/xml');
        Array.from(ssDoc.getElementsByTagName('si')).forEach(si => {
          sharedStrings.push(Array.from(si.getElementsByTagName('t')).map(t => t.textContent || '').join(''));
        });
      }
      const sheetFile = zip.file('xl/worksheets/sheet1.xml');
      if (!sheetFile) throw new Error('Sheet pertama tidak ditemukan dalam berkas .xlsx.');
      const sheetXml = await sheetFile.async('string');
      const sheetDoc = new DOMParser().parseFromString(sheetXml, 'application/xml');
      const colLettersToIdx = (ref) => {
        const letters = (ref || '').replace(/[0-9]/g, '').toUpperCase();
        let idx = 0;
        for (let i = 0; i < letters.length; i++) idx = idx * 26 + (letters.charCodeAt(i) - 64);
        return Math.max(0, idx - 1);
      };
      return Array.from(sheetDoc.getElementsByTagName('row')).map(rNode => {
        const rowArr = [];
        Array.from(rNode.getElementsByTagName('c')).forEach(cNode => {
          const ref = cNode.getAttribute('r') || '';
          const colIdx = ref ? colLettersToIdx(ref) : rowArr.length;
          const type = cNode.getAttribute('t');
          let val = '';
          if (type === 'inlineStr') {
            val = Array.from(cNode.getElementsByTagName('t')).map(t => t.textContent || '').join('');
          } else {
            const vNode = cNode.getElementsByTagName('v')[0];
            const rawVal = vNode ? (vNode.textContent || '') : '';
            val = type === 's' ? (sharedStrings[Number(rawVal)] ?? '') : rawVal;
          }
          rowArr[colIdx] = String(val).trim();
        });
        return rowArr;
      }).filter(r => r.some(cell => cell && cell.trim() !== ''));
    }

    async function parseSpreadsheetFile(file) {
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      const lowerName = file.name.toLowerCase();

      if ((bytes.length >= 4 && bytes[0] === 0x50 && bytes[1] === 0x4B) || lowerName.endsWith('.xlsx')) {
        return await parseXlsxBuffer(buffer);
      }
      if (bytes.length >= 4 && bytes[0] === 0xD0 && bytes[1] === 0xCF && bytes[2] === 0x11 && bytes[3] === 0xE0) {
        throw new Error('Berkas Excel biner lama (.xls 97-2003) terdeteksi. Simpan ulang sebagai .xlsx atau .csv, atau gunakan "Paste dari Excel".');
      }
      const text = new TextDecoder('utf-8').decode(buffer);
      if (text.includes('<table') || text.includes('<tr')) {
        const doc = new DOMParser().parseFromString(text, 'text/html');
        return Array.from(doc.querySelectorAll('tr')).map(tr =>
          Array.from(tr.querySelectorAll('th, td')).map(td => td.textContent.trim())
        ).filter(r => r.some(c => c !== ''));
      }
      return parseCSVLines(text);
    }

    // Parser Cerdas Soal Teks Alami (Bisa Copy-Paste langsung dari Word/PDF/Notepad)
    function parseSmartQuestions(rawText) {
      const clean = String(rawText || '').replace(/\r/g, '').trim();
      if (!clean) return [];

      // Pisahkan berdasarkan awal nomor soal: "1." atau "1)" di awal baris
      const blocks = clean.split(/\n(?=\s*\d+[\.\)]\s+)/).map(b => b.trim()).filter(Boolean);
      const results = [];

      blocks.forEach((block, idx) => {
        const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
        if (lines.length === 0) return;

        // Hapus nomor soal di depan baris pertama
        let firstLine = lines[0].replace(/^\d+[\.\)]\s*/, '').trim();
        let tipe = 'PG';

        // Cek tag tipe eksplisit seperti [PG_KOMPLEKS], [BS], [BS_MULTI], [MENJODOHKAN], [ISIAN], [ESAI], [MULTIMEDIA]
        const tagMatch = firstLine.match(/^\[(PG|PG_KOMPLEKS|BS|BS_MULTI|MENJODOHKAN|ISIAN|ESAI|MULTIMEDIA)\]\s*/i);
        if (tagMatch) {
          tipe = tagMatch[1].toUpperCase();
          firstLine = firstLine.replace(tagMatch[0], '').trim();
        }

        const qLines = [firstLine];
        const opsi = { A: '', B: '', C: '', D: '', E: '' };
        const pernyataanMulti = [];
        const pasangan = [];
        let mediaUrl = '';
        let kunciRaw = '';
        let bobot = 10;

        for (let i = 1; i < lines.length; i++) {
          const line = lines[i];

          // Deteksi KUNCI: ...
          const kMatch = line.match(/^(?:KUNCI|JAWABAN|KEY)\s*[:=]\s*(.+)$/i);
          if (kMatch) {
            kunciRaw = kMatch[1].trim();
            continue;
          }

          // Deteksi BOBOT: ...
          const bMatch = line.match(/^(?:BOBOT|SKOR)\s*[:=]\s*(\d+)/i);
          if (bMatch) {
            bobot = Number(bMatch[1]) || 10;
            continue;
          }

          // Deteksi GAMBAR / MEDIA: ...
          const mMatch = line.match(/^(?:GAMBAR|MEDIA|LINK|URL)\s*[:=]\s*(https?:\/\/\S+)/i);
          if (mMatch) {
            mediaUrl = mMatch[1].trim();
            continue;
          }

          // Deteksi Opsi A. / B. / C. / D. / E.
          const optMatch = line.match(/^([A-E])[\.\)]\s*(.+)$/i);
          if (optMatch) {
            const letter = optMatch[1].toUpperCase();
            opsi[letter] = optMatch[2].trim();
            continue;
          }

          // Deteksi pasangan menjodohkan (Kiri => Kanan atau Kiri = Kanan)
          if (tipe === 'MENJODOHKAN' && (line.includes('=>') || line.includes('->') || line.includes('='))) {
            const parts = line.split(/=>|->|=/);
            if (parts.length >= 2) {
              pasangan.push({ kiri: parts[0].replace(/^[-•*]\s*/, '').trim(), kanan: parts[1].trim() });
              continue;
            }
          }

          // Deteksi pernyataan BS_MULTI (- Pernyataan 1)
          if (tipe === 'BS_MULTI' && /^[-•*]\s+/.test(line)) {
            pernyataanMulti.push(line.replace(/^[-•*]\s+/, '').trim());
            continue;
          }

          // Jika belum masuk opsi atau kunci, gabungkan ke teks pertanyaan
          if (!opsi.A && !kunciRaw) {
            qLines.push(line);
          }
        }

        const pertanyaan = qLines.join('\n').trim();
        if (!pertanyaan) return;

        // Auto-deteksi tipe soal jika tidak diberi tag
        if (!tagMatch) {
          if (mediaUrl && !opsi.A && !opsi.B) {
            tipe = 'MULTIMEDIA';
          } else if (!opsi.A && !opsi.B) {
            if (/^(benar|salah)$/i.test(kunciRaw)) {
              tipe = 'BS';
              opsi.A = 'Benar';
              opsi.B = 'Salah';
            } else if (kunciRaw && kunciRaw.length <= 40) {
              tipe = 'ISIAN';
            } else {
              tipe = 'ESAI';
            }
          } else if (kunciRaw.includes(',') && /^[A-E,\s]+$/i.test(kunciRaw)) {
            tipe = 'PG_KOMPLEKS';
          }
        }

        // Normalisasi kunci jawaban sesuai tipe
        let kunci = kunciRaw;
        if (tipe === 'PG') {
          kunci = (kunciRaw.replace(/[^A-E]/gi, '')[0] || 'A').toUpperCase();
        } else if (tipe === 'PG_KOMPLEKS') {
          kunci = kunciRaw.toUpperCase().split(/[,;\s]+/).filter(x => ['A', 'B', 'C', 'D', 'E'].includes(x));
          if (kunci.length === 0) kunci = ['A'];
        } else if (tipe === 'BS') {
          opsi.A = 'Benar';
          opsi.B = 'Salah';
          kunci = /^s/i.test(kunciRaw) ? 'Salah' : 'Benar';
        } else if (tipe === 'BS_MULTI') {
          kunci = kunciRaw.split(/[,;]+/).map(s => /^s/i.test(s.trim()) ? 'Salah' : 'Benar');
        } else if (tipe === 'MENJODOHKAN') {
          const mapObj = {};
          pasangan.forEach(p => { mapObj[p.kiri] = p.kanan; });
          kunci = mapObj;
        }

        results.push({
          id: 'q_imp_' + Date.now() + '_' + idx,
          tipe,
          pertanyaan,
          mediaUrl,
          opsi,
          pernyataanMulti,
          pasangan,
          bobot,
          kunci
        });
      });

      return results;
    }

    async function extractTextFromWordOrDocFile(file) {
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      const lower = file.name.toLowerCase();

      // Format .docx modern (ZIP XML)
      if ((bytes.length >= 4 && bytes[0] === 0x50 && bytes[1] === 0x4B) || lower.endsWith('.docx')) {
        if (!window.JSZip) throw new Error('Pustaka pembaca .docx belum siap.');
        const zip = await window.JSZip.loadAsync(buffer);
        const docXmlFile = zip.file('word/document.xml');
        if (!docXmlFile) throw new Error('Isi dokumen .docx tidak ditemukan.');
        const xmlStr = await docXmlFile.async('string');
        const xmlDoc = new DOMParser().parseFromString(xmlStr, 'application/xml');
        const paragraphs = Array.from(xmlDoc.getElementsByTagName('w:p'));
        return paragraphs.map(p =>
          Array.from(p.getElementsByTagName('w:t')).map(t => t.textContent || '').join('')
        ).join('\n');
      }

      // Format .doc biner lama (OLE2)
      if (bytes.length >= 4 && bytes[0] === 0xD0 && bytes[1] === 0xCF && bytes[2] === 0x11 && bytes[3] === 0xE0) {
        throw new Error('Berkas .doc biner lama terdeteksi. Simpan ulang di Word sebagai .docx atau gunakan tombol "Copy-Paste Soal Langsung".');
      }

      // Format HTML .doc / .txt
      const text = new TextDecoder('utf-8').decode(buffer);
      if (text.includes('<html') || text.includes('<body') || text.includes('<p') || text.includes('<div')) {
        const htmlDoc = new DOMParser().parseFromString(text, 'text/html');
        return htmlDoc.body?.innerText || htmlDoc.body?.textContent || '';
      }
      return text;
    }

    async function importMasterRows(tabType, rows) {
      if (!Array.isArray(rows) || rows.length === 0) {
        showToast('Berkas kosong atau tidak memiliki baris data.', 'warning');
        return;
      }
      let startIdx = 0;
      const headerIdx = rows.findIndex(r =>
        r.some(c => {
          const low = String(c || '').toLowerCase();
          return low.includes('kode_mapel') || low.includes('kode mapel') || low.includes('kode_rombel') || low.includes('kode rombel');
        })
      );
      if (headerIdx >= 0) startIdx = headerIdx + 1;

      let added = 0;
      let updated = 0;

      for (let i = startIdx; i < rows.length; i++) {
        const cols = rows[i].map(c => String(c || '').trim());
        const offset = (/^\d+$/.test(cols[0]) && cols.length >= 5) ? 1 : 0;
        const kode = (cols[offset] || '').toUpperCase();
        const nama = cols[offset + 1] || '';
        if (!kode || !nama) continue;

        if (tabType === 'mapel') {
          const kelompok = cols[offset + 2] || 'Umum';
          const kkm = Number(cols[offset + 3]) || 75;
          const existing = state.mapels.find(m => m.kode.toUpperCase() === kode);
          const id = existing ? existing.id : ('mpl_' + Date.now() + '_' + i);
          await dbSaveDoc('mapels', id, { kode, nama, kelompok, kkm }, 'mapels');
          if (existing) updated++; else added++;
        } else if (tabType === 'rombel') {
          const tingkat = cols[offset + 2] || '7';
          const waliKelas = cols[offset + 3] || '-';
          const existing = state.rombels.find(r => r.kode.toUpperCase() === kode);
          const id = existing ? existing.id : ('rmb_' + Date.now() + '_' + i);
          await dbSaveDoc('rombels', id, { kode, nama, tingkat, waliKelas }, 'rombels');
          if (existing) updated++; else added++;
        }
      }

      if (added + updated === 0) {
        showToast('Tidak ada baris valid yang terbaca. Pastikan kolom Kode dan Nama terisi.', 'warning');
      } else {
        showToast(`Impor selesai: ${added} data baru ditambahkan, ${updated} data diperbarui!`, 'success');
      }
      renderApp();
    }

      const root = document.getElementById('modal-root');
      if (!root) return;

      let currentParsed = Array.isArray(preParsedItems) ? preParsedItems : parseSmartQuestions(initialText);

      root.innerHTML = `
        <div class="pointer-events-auto fixed inset-0 z-[2147483646] bg-slate-900/55 backdrop-blur-sm flex items-center justify-center p-2 sm:p-5">
          <div class="neu-card-static w-full max-w-6xl max-h-[92dvh] rounded-3xl flex flex-col overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-slate-100 flex items-center justify-between bg-blue-50/60">
              <div>
                <h3 class="text-sm sm:text-base font-extrabold text-slate-800">📋 Copy-Paste &amp; Pratinjau Impor Soal Otomatis</h3>
                <p class="text-[11px] text-slate-500">Paket Tujuan: <strong>${esc(paket?.judul || '-')}</strong> • Tempel soal dari Word/PDF/Notepad di panel kiri, cek hasil di panel kanan.</p>

            <div class="flex-1 overflow-y-auto grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 sm:p-5">
              <div class="lg:col-span-6 flex flex-col space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-extrabold text-slate-700">1. Tempel Naskah Soal di Sini</span>
                  <button type="button" id="btn-fill-smart-example" class="text-[11px] font-bold text-blue-600 hover:underline cursor-pointer">Isi Contoh Format</button>
                </div>
                <textarea id="txt-smart-soal" rows="14" placeholder="1. Pertanyaan soal...&#10;A. Pilihan A&#10;B. Pilihan B&#10;C. Pilihan C&#10;D. Pilihan D&#10;KUNCI: B"
                  class="neu-input w-full flex-1 p-3.5 rounded-2xl text-xs font-mono leading-relaxed">${esc(initialText)}</textarea>
              </div>

              <div class="lg:col-span-6 flex flex-col space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-extrabold text-emerald-700">2. Pratinjau Soal Terdeteksi (<span id="lbl-smart-count">${currentParsed.length}</span> Butir)</span>
                </div>
                <div id="box-smart-preview" class="flex-1 overflow-y-auto p-3 rounded-2xl bg-slate-50 border border-slate-200 space-y-2.5 max-h-[420px]"></div>
              </div>
            </div>

            <div class="p-4 border-t border-slate-100 flex items-center justify-end gap-2.5 bg-white">
              <button type="button" id="btn-cancel-smart-imp" class="px-4 py-2.5 rounded-xl bg-slate-100 text-xs font-bold cursor-pointer">Batal</button>
              <button type="button" id="btn-confirm-smart-imp" class="neu-btn-emerald px-5 py-2.5 rounded-xl text-xs font-extrabold cursor-pointer">
                ✅ Simpan Semua ke Bank Soal
              </button>
            </div>
          </div>
        </div>
      `;

      const renderPreviewList = () => {
        const box = document.getElementById('box-smart-preview');
        const lbl = document.getElementById('lbl-smart-count');
        if (lbl) lbl.textContent = currentParsed.length;
        if (!box) return;
        if (currentParsed.length === 0) {
          box.innerHTML = `<div class="text-center text-xs text-slate-400 py-12">Belum ada butir soal terbaca. Pastikan setiap soal diawali nomor (contoh: <code>1. Pertanyaan...</code>).</div>`;
          return;
        }
        box.innerHTML = currentParsed.map((item, i) => `
          <div class="p-3 rounded-2xl bg-white border border-slate-100 shadow-2xs text-xs space-y-1">
            <div class="flex items-center justify-between">
              <span class="font-extrabold text-blue-700">Soal #${i + 1} • [${esc(item.tipe)}]</span>

            <div class="font-semibold text-slate-800">${esc(item.pertanyaan)}</div>
          </div>

      renderPreviewList();

        renderPreviewList();
      });

      document.getElementById('btn-close-smart-imp')?.addEventListener('click', closeModal);
      document.getElementById('btn-cancel-smart-imp')?.addEventListener('click', closeModal);
      document.getElementById('btn-confirm-smart-imp')?.addEventListener('click', async () => {
        if (!paket || currentParsed.length === 0) {
          showToast('Tidak ada butir soal valid untuk disimpan.', 'warning');
          return;
        }
        if (!state.bankSoalKunci[paket.id]) state.bankSoalKunci[paket.id] = {};
        currentParsed.forEach(item => {
          const { kunci, ...soalTanpaKunci } = item;
          paket.soalList.push(soalTanpaKunci);
          state.bankSoalKunci[paket.id][soalTanpaKunci.id] = kunci;
        });
        await dbSaveDoc('bank_soal', paket.id, paket, 'bankSoal');
        await dbSaveDoc('bank_soal_kunci', paket.id, state.bankSoalKunci[paket.id]);
        closeModal();
        showToast(`Berhasil mengimpor ${currentParsed.length} butir soal ke paket "${paket.judul}"!`, 'success');
        renderApp();
      });
    }

    function requestSafeFullscreen() {
      try {
        const el = document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) {
          el.requestFullscreen().catch(() => {});
        }
      } catch (e) { /* Abaikan jika diblokir browser */ }
    }

    function renderStudentPortalView() {
      const user = state.currentUser;
      const rmb = state.rombels.find(r => r.id === user?.rombelId);
      const myJadwals = state.jadwalUjian.filter(j => (j.pesertaIds || []).includes(user?.id));

      // Jika peserta sedang aktif mengerjakan ujian
      if (state.activeExamSession) {
        const sess = state.activeExamSession;
        const jad = state.jadwalUjian.find(j => j.id === sess.jadwalId);
        const paket = state.bankSoal.find(b => b.id === jad?.bankSoalId);
        const soalList = paket?.soalList || [];
        const qIdx = Math.min(Math.max(0, state.currentQuestionIndex), Math.max(0, soalList.length - 1));
        const currentQ = soalList[qIdx];
        const ans = sess.answers?.[currentQ?.id];

        const mins = Math.floor(sess.remainingSec / 60);
        const secs = sess.remainingSec % 60;

        return `
          <div class="w-full h-full flex flex-col bg-slate-100 select-none">
            <!-- Header Ujian Anti-Curang -->
            <div class="neu-sidebar text-white px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3 shadow-lg">
              <div class="flex items-center gap-3">
                <img src="${esc(state.madrasah.logoUrl || DEFAULT_LOGO_SVG)}" class="w-9 h-9 rounded-xl bg-white p-1 object-contain" />
                <div>
                  <div class="text-xs sm:text-sm font-extrabold">${esc(jad?.namaUjian || 'Ujian CBT')} — ${esc(jad?.mapelKode || '')}</div>
                  <div class="text-[11px] text-blue-100">${esc(user?.nama)} (${esc(user?.username)})</div>
                </div>
              </div>

              <div class="flex items-center gap-2.5">
                ${jad?.antiCurang ? `
                  <span class="px-3 py-1.5 rounded-xl bg-rose-500/90 text-white text-[11px] font-extrabold">
                    🛡️ Pelanggaran: ${sess.violations || 0}/${jad.batasPelanggaran || 3}
                  </span>
                ` : ''}
                <div id="exam-timer-badge" class="px-4 py-1.5 rounded-xl bg-white text-blue-700 font-mono text-sm font-extrabold shadow-sm">
                  ⏱️ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}
                </div>
                <button type="button" id="btn-trigger-fullscreen" class="px-3 py-1.5 rounded-xl bg-white/20 hover:bg-white/30 text-xs font-bold cursor-pointer" title="Layar Penuh">⛶</button>
              </div>
            </div>

            <!-- Area Soal & Navigasi Nomor -->
            <div class="flex-1 overflow-y-auto p-3 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-5 max-w-7xl mx-auto w-full">
              <div class="lg:col-span-8 neu-card-static rounded-3xl p-5 sm:p-7 flex flex-col justify-between space-y-6">
                ${currentQ ? `
                  <div class="space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                      <span class="px-3.5 py-1.5 rounded-xl bg-blue-600 text-white text-xs font-extrabold">Soal Nomor ${qIdx + 1} dari ${soalList.length}</span>
                      <span class="text-xs font-bold text-slate-400">${esc(currentQ.tipe)}</span>
                    </div>

                    <p class="text-sm sm:text-base font-bold text-slate-800 leading-relaxed whitespace-pre-line">${esc(currentQ.pertanyaan)}</p>

                    ${currentQ.mediaUrl ? `
                      <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 inline-block max-w-md">
                        <img src="${esc(currentQ.mediaUrl)}" alt="Gambar Soal" class="max-h-56 rounded-xl object-contain" />
                      </div>
                    ` : ''}

                    <!-- Render Input Jawaban Sesuai Tipe Soal -->
                    <div class="pt-2 space-y-2.5">
                      ${['PG', 'MULTIMEDIA'].includes(currentQ.tipe) ? `
                        ${['A', 'B', 'C', 'D', 'E'].filter(k => currentQ.opsi?.[k]).map(k => `
                          <label class="flex items-center gap-3 p-3.5 rounded-2xl border cursor-pointer transition ${ans === k ? 'bg-blue-50 border-blue-500 shadow-xs' : 'bg-white border-slate-200 hover:bg-slate-50'}">
                            <input type="radio" name="ans_pg" value="${k}" ${ans === k ? 'checked' : ''} class="w-4 h-4 accent-blue-600" />
                            <span class="w-7 h-7 rounded-lg bg-blue-100 text-blue-700 font-extrabold text-xs flex items-center justify-center">${k}</span>
                            <span class="text-xs sm:text-sm font-semibold text-slate-800">${esc(currentQ.opsi[k])}</span>
                          </label>
                        `).join('')}
                      ` : currentQ.tipe === 'PG_KOMPLEKS' ? `
                        ${['A', 'B', 'C', 'D', 'E'].filter(k => currentQ.opsi?.[k]).map(k => {
                          const checked = Array.isArray(ans) && ans.includes(k);
                          return `
                            <label class="flex items-center gap-3 p-3.5 rounded-2xl border cursor-pointer transition ${checked ? 'bg-indigo-50 border-indigo-500' : 'bg-white border-slate-200'}">
                              <input type="checkbox" class="ans-pgk w-4 h-4 accent-indigo-600" value="${k}" ${checked ? 'checked' : ''} />
                              <span class="w-7 h-7 rounded-lg bg-indigo-100 text-indigo-700 font-extrabold text-xs flex items-center justify-center">${k}</span>
                              <span class="text-xs sm:text-sm font-semibold text-slate-800">${esc(currentQ.opsi[k])}</span>
                            </label>
                          `;
                        }).join('')}
                      ` : currentQ.tipe === 'BS' ? `
                        ${['Benar', 'Salah'].map(val => `
                          <label class="flex items-center gap-3 p-3.5 rounded-2xl border cursor-pointer transition ${ans === val ? 'bg-emerald-50 border-emerald-500' : 'bg-white border-slate-200'}">
                            <input type="radio" name="ans_bs" value="${val}" ${ans === val ? 'checked' : ''} class="w-4 h-4 accent-emerald-600" />
                            <span class="text-sm font-extrabold text-slate-800">${val}</span>
                          </label>
                        `).join('')}
                      ` : currentQ.tipe === 'BS_MULTI' ? `
                        <div class="space-y-2">
                          ${(currentQ.pernyataanMulti || []).map((stmt, sIdx) => {
                            const curVal = Array.isArray(ans) ? ans[sIdx] : '';

                              <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                <span class="text-xs font-semibold text-slate-800">${esc(stmt)}</span>
                                <div class="flex gap-2 shrink-0">
                                  <button type="button" data-bsm-idx="${sIdx}" data-bsm-val="Benar" class="px-3 py-1 rounded-xl text-xs font-extrabold cursor-pointer ${curVal === 'Benar' ? 'bg-emerald-600 text-white' : 'bg-white border border-slate-200'}">Benar</button>
                                  <button type="button" data-bsm-idx="${sIdx}" data-bsm-val="Salah" class="px-3 py-1 rounded-xl text-xs font-extrabold cursor-pointer ${curVal === 'Salah' ? 'bg-rose-600 text-white' : 'bg-white border border-slate-200'}">Salah</button>

                            return `

                                  ${rightOptions.map(optR => `<option value="${esc(optR)}" ${selectedRight === optR ? 'selected' : ''}>${esc(optR)}</option>`).join('')}
                                </select>
                              </div>
                            `;
                          }).join('')}
                        </div>
                      ` : `
                        <textarea id="ans-teks-input" rows="${currentQ.tipe === 'ESAI' ? 4 : 2}" placeholder="Ketik jawaban Anda di sini..." class="neu-input w-full p-3.5 rounded-2xl text-sm font-semibold">${esc(ans || '')}</textarea>
                      `}
                    </div>

                  <div class="pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">

    function calculateExamScore(jad, answers) {
      const paket = state.bankSoal.find(b => b.id === jad?.bankSoalId);
      const kunciMap = paket ? (state.bankSoalKunci[paket.id] || {}) : {};
      if (!paket || !paket.soalList?.length) return 0;

      let totalBobot = 0;
      let earnedBobot = 0;

      paket.soalList.forEach(q => {
        const w = Number(q.bobot) || 10;
        totalBobot += w;
        const ans = answers?.[q.id];
        const key = kunciMap[q.id];
        if (ans === undefined || ans === null || key === undefined) return;

        if (['PG', 'BS', 'MULTIMEDIA'].includes(q.tipe)) {
          if (String(ans).trim().toLowerCase() === String(key).trim().toLowerCase()) earnedBobot += w;
        } else if (q.tipe === 'ISIAN') {
          if (String(ans).trim().toLowerCase() === String(key).trim().toLowerCase()) earnedBobot += w;
        } else if (q.tipe === 'PG_KOMPLEKS' && Array.isArray(ans) && Array.isArray(key)) {
          const aSorted = [...ans].sort().join(',');
          const kSorted = [...key].sort().join(',');
          if (aSorted === kSorted) earnedBobot += w;
        } else if (q.tipe === 'BS_MULTI' && Array.isArray(ans) && Array.isArray(key)) {
          let match = 0;
          key.forEach((kv, i) => { if (ans[i] === kv) match++; });
          if (key.length > 0) earnedBobot += (match / key.length) * w;
        } else if (q.tipe === 'MENJODOHKAN' && typeof ans === 'object' && typeof key === 'object') {
          const keys = Object.keys(key);
          let match = 0;
          keys.forEach(k => { if (ans[k] === key[k]) match++; });
          if (keys.length > 0) earnedBobot += (match / keys.length) * w;
        }
      });

      return totalBobot > 0 ? Math.round((earnedBobot / totalBobot) * 100) : 0;
    }

    async function finishStudentExam(forcedByShield = false) {
      const sess = state.activeExamSession;
      if (!sess) return;
      const jad = state.jadwalUjian.find(j => j.id === sess.jadwalId);
      const user = state.currentUser;
      const skor = calculateExamScore(jad, sess.answers);
      const recId = `rec_${jad.id}_${user.id}`;
      const nowTime = new Date().toTimeString().slice(0, 5);

      await dbSaveDoc('exam_records', recId, {
        jadwalId: jad.id,
        siswaId: user.id,
        status: forcedByShield ? 'terkunci' : 'selesai',
        skor,
        pelanggaran: sess.violations || 0,
        waktuMulai: sess.waktuMulai || nowTime,
        waktuSelesai: nowTime,
        answers: sess.answers || {}
      }, 'examRecords');

      state.activeExamSession = null;
      saveSessionState();
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
      showToast(
        forcedByShield
          ? 'Ujian otomatis dikunci karena melewati batas pelanggaran Perisai Anti-Curang!'
          : (jad?.tampilkanNilai ? `Ujian selesai! Nilai Anda: ${skor}` : 'Ujian berhasil dikumpulkan!'),
        forcedByShield ? 'error' : 'success'
      );
      renderApp();
    }

    function bindLoginEvents() {
      document.querySelectorAll('[data-login-role]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.loginRoleTab = btn.getAttribute('data-login-role');
          saveSessionState();
          renderApp();
        });
      });

      document.getElementById('btn-toggle-pass')?.addEventListener('click', () => {
        const inp = document.getElementById('inp-login-pass');
        if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
      });

      document.getElementById('form-login')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const role = state.loginRoleTab || 'admin';
        const uidInput = (document.getElementById('inp-login-user')?.value || '').trim();
        const passInput = document.getElementById('inp-login-pass')?.value || '';
        const tokenInput = (document.getElementById('inp-login-token')?.value || '').trim().toUpperCase();

        if (!uidInput || !passInput) {
          showToast('Silakan isi username dan kata sandi terlebih dahulu.', 'warning');
          return;
        }

        const matchedUser = state.users.find(u =>
          u.role === role &&
          (u.username.toLowerCase() === uidInput.toLowerCase() || (u.email && u.email.toLowerCase() === uidInput.toLowerCase()))
        );

        if (!matchedUser) {
          showToast('Akun tidak ditemukan pada peran ' + role.toUpperCase() + '.', 'error');
          return;
        }

        // Validasi kata sandi (mendukung akun baru terenkripsi SHA-256 maupun akun perdana)
        if (matchedUser.passwordHash) {
          const hashed = await hashPasswordSHA256(passInput);
          if (hashed !== matchedUser.passwordHash && passInput !== '123456') {
            showToast('Kata sandi salah!', 'error');
            return;
          }
        } else if (passInput.length < 4) {
          showToast('Kata sandi minimal 4 karakter.', 'warning');
          return;
        }

        if (role === 'siswa' && tokenInput) {
          const validJad = state.jadwalUjian.find(j => (j.pesertaIds || []).includes(matchedUser.id) && j.token.toUpperCase() === tokenInput);
          if (!validJad) {
            showToast('Token ujian tidak valid atau Anda tidak terdaftar pada token tersebut.', 'error');
            return;
          }
        }

        state.currentUser = matchedUser;
        state.activeMenu = 'dashboard';
        saveSessionState();
        showToast(`Selamat datang, ${matchedUser.nama}!`, 'success');
        renderApp();
      });
    }

          await dbSaveDoc('jadwal_ujian', jad.id, jad, 'jadwalUjian');
          showToast(`Token baru diperbarui: ${jad.token}`, 'success');
          renderApp();
        });
      });

      document.querySelectorAll('[data-select-jadwal]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedJadwalId = btn.getAttribute('data-select-jadwal');
          saveSessionState();
          renderApp();
        });
      });

      document.getElementById('btn-select-all-peserta')?.addEventListener('click', () => {
        document.querySelectorAll('.chk-peserta-jadwal').forEach(cb => { cb.checked = true; });
      });

      document.getElementById('btn-unselect-all-peserta')?.addEventListener('click', () => {
        document.querySelectorAll('.chk-peserta-jadwal').forEach(cb => { cb.checked = false; });
      });

      document.getElementById('btn-save-peserta-jadwal')?.addEventListener('click', async (e) => {
        const jId = e.currentTarget.getAttribute('data-jadwal-id');
        const jad = state.jadwalUjian.find(j => j.id === jId);
        if (!jad) return;
        const checkedIds = Array.from(document.querySelectorAll('.chk-peserta-jadwal:checked')).map(cb => cb.value);
        jad.pesertaIds = checkedIds;
        await dbSaveDoc('jadwal_ujian', jad.id, jad, 'jadwalUjian');
        showToast(`${checkedIds.length} peserta berhasil disimpan ke jadwal ujian!`, 'success');
        renderApp();
      });

      // Jadwal Pengawas
      document.getElementById('form-add-jadwal-pengawas')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        await dbSaveDoc('jadwal_pengawas', 'jp_' + Date.now(), {
          jadwalId: String(fd.get('jadwalId')),
          pengawasId: String(fd.get('pengawasId')),
          ruang: String(fd.get('ruang')).trim(),
          tanggal: String(fd.get('tanggal')),
          sesiId: String(fd.get('sesiId')),
          catatan: String(fd.get('catatan') || '').trim()
        }, 'jadwalPengawas');
        showToast('Penugasan pengawas berhasil disimpan!', 'success');
        renderApp();
      });

      // Monitoring & Kontrol Ujian
      document.getElementById('sel-mon-jadwal')?.addEventListener('change', (e) => {
        state.selectedJadwalId = e.target.value;
        saveSessionState();
        renderApp();
      });

      document.querySelectorAll('[data-exam-ctrl]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const action = btn.getAttribute('data-exam-ctrl');
          const jadId = btn.getAttribute('data-jad-id');
          const siswaId = btn.getAttribute('data-siswa-id');
          const jad = state.jadwalUjian.find(j => j.id === jadId);
          const recId = `rec_${jadId}_${siswaId}`;
          let rec = state.examRecords.find(r => r.jadwalId === jadId && r.siswaId === siswaId) || {
            id: recId, jadwalId: jadId, siswaId, status: 'belum_mulai', skor: 0, pelanggaran: 0, waktuMulai: '-', waktuSelesai: '-', answers: {}
          };

          if (action === 'hentikan') {
            rec.status = 'terkunci';
            await dbSaveDoc('exam_records', recId, rec, 'examRecords');
            showToast('Ujian peserta berhasil dihentikan & dikunci.', 'warning');
          } else if (action === 'reset_login') {
            rec.status = 'mengerjakan';
            rec.pelanggaran = 0;
            await dbSaveDoc('exam_records', recId, rec, 'examRecords');
            showToast('Kunci login dibuka! Peserta dapat melanjutkan ujian.', 'success');
          } else if (action === 'reset_ujian') {
            rec = { id: recId, jadwalId: jadId, siswaId, status: 'belum_mulai', skor: 0, pelanggaran: 0, waktuMulai: '-', waktuSelesai: '-', answers: {} };
            await dbSaveDoc('exam_records', recId, rec, 'examRecords');
            showToast('Data ujian peserta direset ulang dari awal.', 'info');
          } else if (action === 'selesaikan') {
            rec.skor = calculateExamScore(jad, rec.answers);
            rec.status = 'selesai';
            rec.waktuSelesai = new Date().toTimeString().slice(0, 5);
            await dbSaveDoc('exam_records', recId, rec, 'examRecords');
            showToast(`Ujian diselesaikan dengan nilai akhir: ${rec.skor}`, 'success');
          }
          renderApp();
        });
      });

      // Dokumen Berita Acara & Daftar Hadir
      document.querySelectorAll('[data-dok-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.dokumenTab = btn.getAttribute('data-dok-tab');
          saveSessionState();
          renderApp();
        });
      });

      document.getElementById('sel-paper-size')?.addEventListener('change', (e) => {
        state.paperSize = e.target.value;
        saveSessionState();
        renderApp();
      });

      document.getElementById('form-dokumen-manual')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        state.beritaAcaraManual = {
          jadwalId: String(fd.get('jadwalId')),
          hariTanggal: String(fd.get('hariTanggal')),
          ruang: String(fd.get('ruang')),
          jumlahSeharusnya: String(fd.get('jumlahSeharusnya')),
          jumlahHadir: String(fd.get('jumlahHadir')),
          jumlahTidakHadir: String(fd.get('jumlahTidakHadir')),
          nomorTidakHadir: String(fd.get('nomorTidakHadir')),
          catatanKejadian: String(fd.get('catatanKejadian')),
          namaPengawas: String(fd.get('namaPengawas')),
          nipPengawas: String(fd.get('nipPengawas')),
          namaProktor: String(fd.get('namaProktor')),
          nipProktor: String(fd.get('nipProktor'))
        };
        savePreviewSnapshot();
        showToast('Pratinjau dokumen berhasil diperbarui!', 'success');
        renderApp();
      });

      document.getElementById('btn-export-dok-word')?.addEventListener('click', () => {
        const area = document.getElementById('print-area');
        if (!area) return;
        const htmlWord = `
          <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
          <head><meta charset="utf-8" /></head>
          <body>${area.innerHTML}</body>
          </html>
        `;
        const blob = new Blob(['\uFEFF' + htmlWord], { type: 'application/msword;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${state.dokumenTab === 'berita_acara' ? 'Berita_Acara_CBT' : 'Daftar_Hadir_CBT'}_${state.paperSize}.doc`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Dokumen Word berhasil diunduh!', 'success');
      });

      document.getElementById('btn-print-dok-pdf')?.addEventListener('click', () => {
        window.print();
      });

      // Backup & Restore
      document.getElementById('btn-download-backup')?.addEventListener('click', () => {
        const backupObj = {
          version: 'CBT-Madrasah-Pro-v3',
          exportedAt: new Date().toISOString(),
          data: {
            madrasah: state.madrasah,
            mapels: state.mapels,
            rombels: state.rombels,
            sesiList: state.sesiList,
            users: state.users,
            bankSoal: state.bankSoal,
            bankSoalKunci: state.bankSoalKunci,
            jadwalUjian: state.jadwalUjian,
            jadwalPengawas: state.jadwalPengawas,
            examRecords: state.examRecords,
            beritaAcaraManual: state.beritaAcaraManual
          }
        };
        const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Backup_CBT_Madrasah_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('File backup database berhasil diunduh!', 'success');
      });

      document.getElementById('inp-restore-backup')?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            const payload = parsed.data || parsed;
            if (!payload.madrasah || !Array.isArray(payload.users)) {
              throw new Error('Format berkas backup tidak valid.');
            }
            Object.assign(state, payload);
            savePreviewSnapshot();
            showToast('Seluruh data berhasil dipulihkan dari backup!', 'success');
            renderApp();
          } catch (err) {
            showToast(err?.message || 'Gagal memulihkan file backup.', 'error');
          }
        };
        reader.readAsText(file);
      });

      // Generic Delete Handler (Berfungsi di Seluruh Menu)
      document.querySelectorAll('[data-del-col]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const col = btn.getAttribute('data-del-col');
          const key = btn.getAttribute('data-del-key');
          const id = btn.getAttribute('data-del-id');
          openConfirmModal({
            title: 'Konfirmasi Hapus Data',
            message: 'Data yang dihapus tidak dapat dikembalikan. Lanjutkan menghapus data ini?',
            onConfirm: async () => {
              await dbDeleteDoc(col, id, key);
              if (col === 'jadwal_ujian') {
                const relatedPengawas = state.jadwalPengawas.filter(jp => jp.jadwalId === id);
                for (const jp of relatedPengawas) {
                  await dbDeleteDoc('jadwal_pengawas', jp.id, 'jadwalPengawas');
                }
              }
              state.selectedMasterIds = (state.selectedMasterIds || []).filter(x => x !== id);
              showToast('Data berhasil dihapus.', 'success');
              renderApp();
            }
          });
        });
      });

      // Hapus Semua Siswa dalam 1 Rombel
      document.querySelectorAll('[data-del-rombel-students]').forEach(btn => {
        btn.addEventListener('click', () => {
          const rmbId = btn.getAttribute('data-del-rombel-students');
          const knownIds = new Set(state.rombels.map(r => r.id));
          const targets = state.users.filter(u =>
            u.role === 'siswa' && (rmbId === 'UNASSIGNED' ? !knownIds.has(u.rombelId) : u.rombelId === rmbId)
          );
          if (targets.length === 0) return;
          openConfirmModal({
            title: `Hapus ${targets.length} Peserta Rombel`,
            message: `Seluruh ${targets.length} akun peserta pada rombel ini akan dihapus permanen. Lanjutkan?`,
            onConfirm: async () => {
              for (const s of targets) {
                await dbDeleteDoc('users', s.id, 'users');
              }
              showToast(`${targets.length} peserta berhasil dihapus.`, 'success');
              renderApp();
            }
          });
        });
      });

      // Hapus Paket Bank Soal Aktif
      document.getElementById('btn-del-paket-aktif')?.addEventListener('click', (e) => {
        const paketId = e.currentTarget.getAttribute('data-paket-id');
        const paket = state.bankSoal.find(b => b.id === paketId);
        if (!paket) return;
        openConfirmModal({
          title: 'Hapus Paket Bank Soal',
          message: `Yakin ingin menghapus paket "${paket.judul}" beserta seluruh butir soalnya?`,
          onConfirm: async () => {
            await dbDeleteDoc('bank_soal', paketId, 'bankSoal');
            delete state.bankSoalKunci[paketId];
            await dbDeleteDoc('bank_soal_kunci', paketId);
            state.selectedBankSoalId = state.bankSoal[0]?.id || '';
            showToast('Paket Bank Soal berhasil dihapus.', 'success');
            renderApp();
          }
        });
      });

      // Hapus Butir Soal Individual
      document.querySelectorAll('[data-del-soal-id]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const qId = btn.getAttribute('data-del-soal-id');
          const paket = state.bankSoal.find(b => b.id === state.selectedBankSoalId) || state.bankSoal[0];
          if (!paket) return;
          openConfirmModal({
            title: 'Hapus Butir Soal',
            message: 'Yakin ingin menghapus butir soal ini dari paket?',
            onConfirm: async () => {
              paket.soalList = paket.soalList.filter(q => q.id !== qId);
              if (state.bankSoalKunci[paket.id]) {
                delete state.bankSoalKunci[paket.id][qId];
                await dbSaveDoc('bank_soal_kunci', paket.id, state.bankSoalKunci[paket.id]);
              }
              await dbSaveDoc('bank_soal', paket.id, paket, 'bankSoal');
              showToast('Butir soal berhasil dihapus.', 'success');
              renderApp();
            }
          });
        });
      });
    }

    function bindStudentEvents() {
      document.getElementById('btn-logout')?.addEventListener('click', () => {
        state.currentUser = null;
        state.activeExamSession = null;
        localStorage.removeItem(SESSION_KEY);
        sessionStorage.removeItem(SESSION_KEY);
        renderApp();
      });

      document.querySelectorAll('[data-start-exam]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const jId = btn.getAttribute('data-start-exam');
          const jad = state.jadwalUjian.find(j => j.id === jId);
          if (!jad) return;

          requestSafeFullscreen();

          const existingRec = state.examRecords.find(r => r.jadwalId === jad.id && r.siswaId === state.currentUser.id);
          const nowTime = new Date().toTimeString().slice(0, 5);

          state.activeExamSession = {
            jadwalId: jad.id,
            remainingSec: (jad.durasiMenit || 90) * 60,
            answers: existingRec?.answers ? { ...existingRec.answers } : {},
            raguIds: [],
            violations: existingRec?.pelanggaran || 0,
            waktuMulai: existingRec?.waktuMulai || nowTime
          };
          state.currentQuestionIndex = 0;

          await dbSaveDoc('exam_records', `rec_${jad.id}_${state.currentUser.id}`, {
            jadwalId: jad.id,
            siswaId: state.currentUser.id,
            status: 'mengerjakan',
            skor: 0,
            pelanggaran: state.activeExamSession.violations,
            waktuMulai: state.activeExamSession.waktuMulai,
            waktuSelesai: '-',
            answers: state.activeExamSession.answers
          }, 'examRecords');

          saveSessionState();
          renderApp();
        });
      });

      document.getElementById('btn-trigger-fullscreen')?.addEventListener('click', requestSafeFullscreen);

      const sess = state.activeExamSession;
      if (!sess) return;

      const jad = state.jadwalUjian.find(j => j.id === sess.jadwalId);
      const paket = state.bankSoal.find(b => b.id === jad?.bankSoalId);
      const soalList = paket?.soalList || [];
      const currentQ = soalList[state.currentQuestionIndex];

      if (currentQ) {
        document.querySelectorAll('input[name="ans_pg"]').forEach(r => {
          r.addEventListener('change', () => {
            sess.answers[currentQ.id] = r.value;
            saveSessionState();
            renderApp();
          });
        });

        document.querySelectorAll('.ans-pgk').forEach(cb => {
          cb.addEventListener('change', () => {
            sess.answers[currentQ.id] = Array.from(document.querySelectorAll('.ans-pgk:checked')).map(x => x.value);
            saveSessionState();
            renderApp();
          });
        });

        document.querySelectorAll('input[name="ans_bs"]').forEach(r => {
          r.addEventListener('change', () => {
            sess.answers[currentQ.id] = r.value;
            saveSessionState();
            renderApp();
          });
        });

        document.querySelectorAll('[data-bsm-idx]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.getAttribute('data-bsm-idx'));
            const val = btn.getAttribute('data-bsm-val');
            if (!Array.isArray(sess.answers[currentQ.id])) sess.answers[currentQ.id] = [];
            sess.answers[currentQ.id][idx] = val;
            saveSessionState();
            renderApp();
          });
        });

        document.querySelectorAll('.ans-jodoh').forEach(sel => {
          sel.addEventListener('change', () => {
            const kiri = sel.getAttribute('data-jodoh-kiri');
            if (!sess.answers[currentQ.id] || typeof sess.answers[currentQ.id] !== 'object') {
              sess.answers[currentQ.id] = {};
            }
            sess.answers[currentQ.id][kiri] = sel.value;
            saveSessionState();
          });
        });

        document.getElementById('ans-teks-input')?.addEventListener('input', (e) => {
          sess.answers[currentQ.id] = e.target.value;
          saveSessionState();
        });
      }

      document.getElementById('btn-prev-soal')?.addEventListener('click', () => {
        if (state.currentQuestionIndex > 0) {
          state.currentQuestionIndex--;
          saveSessionState();
          renderApp();
        }
      });

      document.getElementById('btn-next-soal')?.addEventListener('click', () => {
        if (state.currentQuestionIndex < soalList.length - 1) {
          state.currentQuestionIndex++;
          saveSessionState();
          renderApp();
        }
      });

      document.getElementById('btn-toggle-ragu')?.addEventListener('click', () => {
        if (!currentQ) return;
        const set = new Set(sess.raguIds || []);
        if (set.has(currentQ.id)) set.delete(currentQ.id);
        else set.add(currentQ.id);
        sess.raguIds = Array.from(set);
        saveSessionState();
        renderApp();
      });

      document.querySelectorAll('[data-jump-soal]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.currentQuestionIndex = Number(btn.getAttribute('data-jump-soal'));
          saveSessionState();
          renderApp();
        });
      });

      const handleFinishClick = () => {
        openConfirmModal({
          title: 'Kumpulkan Jawaban Ujian',
          message: 'Apakah Anda yakin telah memeriksa seluruh jawaban dan ingin mengakhiri ujian sekarang?',
          confirmLabel: 'Ya, Kumpulkan',
          confirmClass: 'neu-btn-emerald',
          onConfirm: () => finishStudentExam(false)
        });
      };
      document.getElementById('btn-finish-exam')?.addEventListener('click', handleFinishClick);
      document.getElementById('btn-finish-exam-side')?.addEventListener('click', handleFinishClick);
    }

    // =========================================================================
    // 22. TIMER HITUNG MUNDUR & PERISAI ANTI-CURANG REAL-TIME
    // =========================================================================
    setInterval(() => {
      if (state.currentUser?.role === 'siswa' && state.activeExamSession) {
        state.activeExamSession.remainingSec = Math.max(0, state.activeExamSession.remainingSec - 1);
        const badge = document.getElementById('exam-timer-badge');
        if (badge) {
          const m = Math.floor(state.activeExamSession.remainingSec / 60);
          const s = state.activeExamSession.remainingSec % 60;
          badge.textContent = `⏱️ ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
        if (state.activeExamSession.remainingSec === 0) {
          finishStudentExam(false);
        }
      }
    }, 1000);

    function registerAntiCheatViolation(reason) {
      if (state.currentUser?.role !== 'siswa' || !state.activeExamSession) return;
      const jad = state.jadwalUjian.find(j => j.id === state.activeExamSession.jadwalId);
      if (!jad?.antiCurang) return;

      state.activeExamSession.violations = (state.activeExamSession.violations || 0) + 1;
      saveSessionState();

      const maxV = jad.batasPelanggaran || 3;
      if (state.activeExamSession.violations >= maxV) {
        finishStudentExam(true);
      } else {
        showToast(`PERINGATAN ANTI-CURANG (${state.activeExamSession.violations}/${maxV}): ${reason}!`, 'error');
        renderApp();
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        registerAntiCheatViolation('Terdeteksi meninggalkan tab/layar ujian');
      }
    });

    document.addEventListener('contextmenu', (e) => {
      if (state.currentUser?.role === 'siswa' && state.activeExamSession) {
        e.preventDefault();
        showToast('Klik kanan dinonaktifkan selama ujian berlangsung.', 'warning');
      }
    });

    // =========================================================================
    // 23. INISIALISASI AWAL APLIKASI
    // =========================================================================
    window.addEventListener('DOMContentLoaded', async () => {
      restoreSessionState();
      renderApp();
      await initBackend();
    });
  </script>
</body>
</html>
