    function isolateViewportFromBlogger() {
      try {
        const appRoot = document.getElementById('app-root');
        const toastRoot = document.getElementById('toast-container');
        const modalRoot = document.getElementById('modal-root');

        if (appRoot && appRoot.parentElement !== document.body) {
          document.body.appendChild(appRoot);
        }
        if (modalRoot && modalRoot.parentElement !== document.body) {
          document.body.appendChild(modalRoot);
        }
        if (toastRoot && toastRoot.parentElement !== document.body) {
          document.body.appendChild(toastRoot);
        }

        Array.from(document.body.children).forEach(el => {
          if (el !== appRoot && el !== modalRoot && el !== toastRoot && el.tagName !== 'SCRIPT' && el.tagName !== 'STYLE') {
            el.style.setProperty('display', 'none', 'important');
          }
        });

        document.documentElement.style.setProperty('margin', '0', 'important');
        document.documentElement.style.setProperty('padding', '0', 'important');
        document.documentElement.style.setProperty('width', '100%', 'important');
        document.documentElement.style.setProperty('height', '100%', 'important');
        document.documentElement.style.setProperty('overflow', 'hidden', 'important');

        document.body.style.setProperty('margin', '0', 'important');
        document.body.style.setProperty('padding', '0', 'important');
        document.body.style.setProperty('width', '100%', 'important');
        document.body.style.setProperty('height', '100%', 'important');
        document.body.style.setProperty('overflow', 'hidden', 'important');
      } catch (e) {}
    }

    const memoryFallback = {};
    const safeStorage = {
      getItem(key) {
        try {
          const val = window.localStorage.getItem(key);
          if (val !== null) return val;
        } catch (e) {}
        try {
          const sVal = window.sessionStorage.getItem(key);
          if (sVal !== null) return sVal;
        } catch (e) {}
        return memoryFallback[key] ?? null;
      },
      setItem(key, val) {
        const strVal = String(val);
        try {
          window.localStorage.setItem(key, strVal);
        } catch (e) {}
        try {
          window.sessionStorage.setItem(key, strVal);
        } catch (e) {}
        memoryFallback[key] = strVal;
      },
      removeItem(key) {
        try {
          window.localStorage.removeItem(key);
        } catch (e) {}
        try {
          window.sessionStorage.removeItem(key);
        } catch (e) {}
        delete memoryFallback[key];
      }
    };

    // Simpan & pulihkan sesi login pengguna agar tidak keluar saat halaman di-refresh
    function saveSessionState() {
      try {
        if (!state.currentUser) {
          safeStorage.removeItem('cbt_active_session');
          return;
        }
        const sessionPayload = {
          currentUser: state.currentUser,
          impersonatedFromAdmin: state.impersonatedFromAdmin,
          activeMenu: state.activeMenu,
          activeExam: state.activeExam
        };
        safeStorage.setItem('cbt_active_session', JSON.stringify(sessionPayload));
      } catch (e) {}
    }

    function restoreSessionState() {
      try {
        const raw = safeStorage.getItem('cbt_active_session');
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.currentUser) {
          state.currentUser = parsed.currentUser;
          state.impersonatedFromAdmin = parsed.impersonatedFromAdmin || null;
          if (parsed.activeMenu) state.activeMenu = parsed.activeMenu;
          if (parsed.activeExam) {
            state.activeExam = {
              ...parsed.activeExam,
              warningOverlay: null
            };
          }
        }
      } catch (e) {}
    }

    function clearSessionState() {
      safeStorage.removeItem('cbt_active_session');

    let fbAuth = null;

    async function hashPasswordSHA256(plainText) {
      const text = String(plainText || '');
      if (window.crypto && window.crypto.subtle) {
        const enc = new TextEncoder().encode(text);
        const buf = await window.crypto.subtle.digest('SHA-256', enc);
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      let hash = 0;
      for (let i = 0; i < text.length; i++) {
        hash = ((hash << 5) - hash) + text.charCodeAt(i);
        hash |= 0;
      }
      return 'fallback_' + Math.abs(hash).toString(16);
    }

    async function attachFirestoreListeners() {
      if (IS_PREVIEW || !fbDb) return;
      firestoreUnsubscribers.forEach(unsub => { try { unsub(); } catch (e) {} });
      firestoreUnsubscribers = [];

      const { collection, doc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

      firestoreUnsubscribers.push(
        onSnapshot(doc(fbDb, 'madrasah_settings', 'main'), (snap) => {
          if (snap.exists()) {
            state.madrasah = { ...state.madrasah, ...snap.data() };
            safeStorage.setItem('cbt_madrasah_settings', JSON.stringify(state.madrasah));
            renderApp();
          }
        })
      );

      const bindCol = (colName, stateKey) => {
        firestoreUnsubscribers.push(
          onSnapshot(collection(fbDb, colName), (qs) => {
            const list = [];
            qs.forEach(d => list.push({ id: d.id, ...d.data() }));
            if (list.length > 0) {
              state[stateKey] = list;
              renderApp();
            }
          })
        );
      };

      bindCol('rombels', 'rombels');
      bindCol('mapels', 'mapels');
      bindCol('sesi', 'sesiList');
      bindCol('users', 'users');
      bindCol('bank_soal', 'bankSoal');
      bindCol('jadwal_ujian', 'jadwalUjian');
      bindCol('jadwal_pengawas', 'jadwalPengawas');
      bindCol('exam_records', 'examRecords');

      firestoreUnsubscribers.push(
        onSnapshot(collection(fbDb, 'bank_soal_kunci'), (qs) => {
          qs.forEach(d => {
            state.bankSoalKunci[d.id] = d.data();
          });
        })
      );
    }

    async function initDatabaseLayer() {
      const savedMadrasah = safeStorage.getItem('cbt_madrasah_settings');
      if (savedMadrasah) {
        try {
          state.madrasah = { ...state.madrasah, ...JSON.parse(savedMadrasah) };
        } catch (e) {}
      }

      // Pulihkan data & sesi login sebelum merender tampilan awal
      restorePreviewSnapshot();
      restoreSessionState();

      if (IS_PREVIEW) {
        const defaultHash = await hashPasswordSHA256('123456');
        state.users.forEach(u => {
          if (!u.passwordHash) u.passwordHash = defaultHash;
        });
        return;
      }

      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const { getAuth, signInAnonymously, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
      const { getFirestore } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

      const app = initializeApp(firebaseConfig);
      fbAuth = getAuth(app);
      fbDb = getFirestore(app);

      onAuthStateChanged(fbAuth, async (user) => {
        if (user) {
          anonAuthRestricted = false;
          // Jika admin masuk via Firebase Email/Password, pulihkan sesi admin saat refresh
          if (!user.isAnonymous && user.email && !state.currentUser) {
            state.currentUser = {
              id: user.uid,
              role: 'admin',
              username: user.email,
              namaLengkap: 'Administrator Madrasah'
            };
            saveSessionState();
          }
          await attachFirestoreListeners();
          renderApp();
        }
      });

      if (!fbAuth.currentUser) {
        try {
          await signInAnonymously(fbAuth);
        } catch (authErr) {
          anonAuthRestricted = true;
          console.warn('Anonymous Auth belum aktif di Firebase Console:', authErr?.code || authErr);
        }
      }

      if (fbAuth.currentUser) {
        await attachFirestoreListeners();
      }
    }

    // 5. TEMPLATE CSV SIMETRIS, EKSPOR/IMPOR WORD SOAL & DOKUMEN A4/F4
    // =========================================================================
    function downloadCSV(filename, headers, rows) {
      const sep = ';';
      const escapeCell = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;
      const lines = [
        headers.map(escapeCell).join(sep),
        ...rows.map(r => r.map(escapeCell).join(sep))
      ];
      const csvContent = '\uFEFF' + lines.join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(`Template/Data CSV "${filename}" berhasil diunduh.`, 'success');
    }

    function parseCSVLines(text) {
      const clean = text.replace(/^\uFEFF/, '').trim();
      if (!clean) return [];
      const firstLine = clean.split(/\r?\n/)[0] || '';
      const sep = (firstLine.split(';').length >= firstLine.split(',').length) ? ';' : ',';
      return clean.split(/\r?\n/).map(line => {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i + 1] === '"') {
              cur += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === sep && !inQuotes) {
            result.push(cur.trim());
            cur = '';
          } else {
            cur += ch;
          }
        }
        result.push(cur.trim());
        return result;
      });
    }

    async function importSoalFromWordHTML(rawText, paketId) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(rawText, 'text/html');
      const tables = Array.from(doc.querySelectorAll('table'));
      const targetTable = tables.find(t => t.querySelectorAll('tr').length >= 2);
      if (!targetTable) {
        showToast('Tabel soal tidak ditemukan di berkas Word (.doc/.html). Pastikan menggunakan Template Word CBT.', 'error');
        return;
      }

      const paket = state.bankSoal.find(b => b.id === paketId);
      if (!paket) return;

      const rows = Array.from(targetTable.querySelectorAll('tr')).slice(1);
      const kunciObj = { ...(state.bankSoalKunci[paket.id] || {}) };
      let addedCount = 0;

      rows.forEach((tr, idx) => {
        const cells = Array.from(tr.querySelectorAll('td, th')).map(c => c.textContent.trim());
        if (cells.length < 3 || !cells[2]) return;

        const tipeRaw = (cells[1] || 'pg').toLowerCase();
        const validTipe = QUESTION_TYPES.some(t => t.id === tipeRaw) ? tipeRaw : 'pg';
        const qId = 'q_imp_' + Date.now() + '_' + idx;
        const extra = cells[9] || '';
        const kunciRaw = cells[10] || '';
        const bobot = Number(cells[11]) || 10;

        const newQ = {
          id: qId,
          tipe: validTipe,
          pertanyaan: cells[2],
          mediaUrl: cells[3] || '',
          mediaType: 'image',
          bobot
        };

        if (validTipe === 'pg' || validTipe === 'pg_kompleks' || validTipe === 'multimedia') {
          newQ.opsi = {
            A: cells[4] || '',
            B: cells[5] || '',
            C: cells[6] || '',
            D: cells[7] || '',
            E: cells[8] || ''
          };
          kunciObj[qId] = validTipe === 'pg_kompleks'
            ? kunciRaw.split(',').map(x => x.trim().toUpperCase()).filter(Boolean)
            : kunciRaw.toUpperCase();
        } else if (validTipe === 'bs') {
          newQ.pernyataanTunggal = cells[2];
          kunciObj[qId] = kunciRaw || 'Benar';
        } else if (validTipe === 'bs_multi') {
          newQ.pernyataanList = extra.split('|').map(x => x.trim()).filter(Boolean);
          kunciObj[qId] = kunciRaw.split('|').map(x => x.trim());
        } else if (validTipe === 'menjodohkan') {
          const pairs = extra.split('|').map(x => x.trim()).filter(Boolean);
          newQ.pasanganKiri = pairs.map(p => p.split('=')[0]?.trim() || '');
          newQ.pasanganKananPilihan = pairs.map(p => p.split('=')[1]?.trim() || '');
          kunciObj[qId] = kunciRaw ? kunciRaw.split('|').map(x => x.trim()) : [...newQ.pasanganKananPilihan];
        } else {
          kunciObj[qId] = kunciRaw;
        }

        paket.soalList.push(newQ);
        addedCount++;
      });

      if (addedCount > 0) {
        state.bankSoalKunci[paket.id] = kunciObj;
        await dbSaveDoc('bank_soal', paket.id, paket, 'bankSoal');
        await dbSaveDoc('bank_soal_kunci', paket.id, kunciObj);
        showToast(`${addedCount} soal berhasil diimpor dari berkas Word!`, 'success');
        renderApp();
      } else {
        showToast('Tidak ada baris soal valid yang ditemukan di tabel.', 'warning');
      }
    }

    function calculateExamScore(paket, jawabanMap) {
      const kunciMap = state.bankSoalKunci[paket.id] || {};
      let totalBobot = 0;
      let earnedBobot = 0;

      (paket.soalList || []).forEach(q => {
        const bobot = Number(q.bobot || 10);
        totalBobot += bobot;
        const ans = jawabanMap[q.id];
        const key = kunciMap[q.id];
        if (ans === undefined || ans === null || key === undefined) return;

        if (q.tipe === 'pg' || q.tipe === 'bs' || q.tipe === 'multimedia') {
          if (String(ans).trim().toLowerCase() === String(key).trim().toLowerCase()) {
            earnedBobot += bobot;
          }
        } else if (q.tipe === 'pg_kompleks') {
          const aArr = Array.isArray(ans) ? [...ans].sort() : [];
          const kArr = Array.isArray(key) ? [...key].sort() : [];
          if (aArr.length > 0 && aArr.length === kArr.length && aArr.every((v, i) => v === kArr[i])) {
            earnedBobot += bobot;
          }
        } else if (q.tipe === 'bs_multi' || q.tipe === 'menjodohkan') {
          const aArr = Array.isArray(ans) ? ans : [];
          const kArr = Array.isArray(key) ? key : [];
          if (kArr.length > 0) {
            let matchCount = 0;
            kArr.forEach((kv, idx) => {
              if (String(aArr[idx] || '').trim().toLowerCase() === String(kv).trim().toLowerCase()) {
                matchCount++;
              }
            });
            earnedBobot += (matchCount / kArr.length) * bobot;
          }
        } else if (q.tipe === 'isian') {
          if (String(ans).trim().toLowerCase() === String(key).trim().toLowerCase()) {
            earnedBobot += bobot;
          }
        } else if (q.tipe === 'esai') {
          const ansStr = String(ans).trim().toLowerCase();
          if (ansStr.length >= 8) {
            earnedBobot += bobot * 0.8;
          }
        }
      });

      if (totalBobot <= 0) return 0;
      return Math.round((earnedBobot / totalBobot) * 100);
    }

    async function startExamSession(jadwalId, tokenInput) {
      const jad = state.jadwalUjian.find(j => j.id === jadwalId);
      if (!jad) return;

      if ((tokenInput || '').trim().toUpperCase() !== jad.token.trim().toUpperCase()) {
        showToast('Token Ujian tidak sesuai! Silakan periksa kembali dari Pengawas.', 'error');
        return;
      }

      const paket = state.bankSoal.find(b => b.id === jad.bankSoalId);
      if (!paket || !paket.soalList?.length) {
        showToast('Paket soal belum tersedia pada jadwal ini.', 'error');
        return;
      }

      const siswaId = state.currentUser.id;
      const recId = `rec_${jad.id}_${siswaId}`;
      let rec = state.examRecords.find(r => r.id === recId);

      if (rec && rec.status === 'terkunci') {
        showToast('Akun ujian Anda sedang terkunci oleh Perisai Anti-Curang. Hubungi Pengawas untuk membuka kunci!', 'error');
        return;
      }

      if (rec && rec.status === 'selesai') {
        showToast('Anda sudah menyelesaikan ujian ini.', 'info');
        return;
      }

      let soalOrder = [...paket.soalList];
      if (jad.acakSoal) {
        soalOrder.sort(() => Math.random() - 0.5);
      }

      if (!rec) {
        rec = {
          id: recId,
          jadwalId: jad.id,
          siswaId,
          status: 'mengerjakan',
          isLoggedIn: true,
          waktuMulai: new Date().toLocaleTimeString('id-ID'),
          sisaDetik: (jad.durasiMenit || 60) * 60,
          pelanggaran: 0,
          logPelanggaran: [],
          jawaban: {},
          nilai: 0
        };
      } else {
        rec.status = 'mengerjakan';
        rec.isLoggedIn = true;
      }

      await dbSaveDoc('exam_records', rec.id, rec, 'examRecords');

      state.activeExam = {
        jadwalId: jad.id,
        recordId: rec.id,
        paketId: paket.id,
        soalOrder,
        currentIndex: 0,
        raguMap: {},
        warningOverlay: null
      };

      saveSessionState();
      requestBrowserFullscreen();
      startExamTimer();
      renderApp();
      showToast('Mode Fullscreen & Perisai Anti-Curang aktif. Selamat mengerjakan!', 'success');
    }

    function startExamTimer() {
      if (examTimerInterval) clearInterval(examTimerInterval);
      examTimerInterval = setInterval(async () => {
        if (!state.activeExam) {
          clearInterval(examTimerInterval);
          return;
        }
        const rec = state.examRecords.find(r => r.id === state.activeExam.recordId);
        if (!rec || rec.status !== 'mengerjakan') {
          clearInterval(examTimerInterval);
          state.activeExam = null;
          renderApp();
          return;
        }

        if (rec.sisaDetik <= 1) {
          clearInterval(examTimerInterval);
          await finishExamSession(true);
          return;
        }

        rec.sisaDetik -= 1;
        const timerEl = document.getElementById('exam-timer-display');
        if (timerEl) {
          const hrs = String(Math.floor(rec.sisaDetik / 3600)).padStart(2, '0');
          const mins = String(Math.floor((rec.sisaDetik % 3600) / 60)).padStart(2, '0');
          const secs = String(rec.sisaDetik % 60).padStart(2, '0');
          timerEl.textContent = `${hrs}:${mins}:${secs}`;
        }
      }, 1000);
    }

    async function registerAntiCheatViolation(reason) {
      if (!state.activeExam) return;
      const jad = state.jadwalUjian.find(j => j.id === state.activeExam.jadwalId);
      if (!jad || !jad.antiCurang) return;

      const rec = state.examRecords.find(r => r.id === state.activeExam.recordId);
      if (!rec || rec.status !== 'mengerjakan') return;

      const timeStr = new Date().toLocaleTimeString('id-ID');
      rec.pelanggaran = (rec.pelanggaran || 0) + 1;
      rec.logPelanggaran = [...(rec.logPelanggaran || []), `${timeStr} — ${reason}`];

      if (rec.pelanggaran >= 3) {
        rec.status = 'terkunci';
        await dbSaveDoc('exam_records', rec.id, rec, 'examRecords');
        clearInterval(examTimerInterval);
        state.activeExam = null;
        exitBrowserFullscreen();
        showToast('UJIAN DIHENTIKAN OTOMATIS: Terdeteksi 3x pelanggaran Perisai Anti-Curang!', 'error');
        renderApp();
        return;
      }

      await dbSaveDoc('exam_records', rec.id, rec, 'examRecords');
      state.activeExam.warningOverlay = {
        count: rec.pelanggaran,
        reason
      };
      renderApp();
    }

    async function finishExamSession(isAutoTimeout = false) {
      if (!state.activeExam) return;
      const rec = state.examRecords.find(r => r.id === state.activeExam.recordId);
      const paket = state.bankSoal.find(b => b.id === state.activeExam.paketId);
      const jad = state.jadwalUjian.find(j => j.id === state.activeExam.jadwalId);

      if (rec && paket) {
        rec.status = 'selesai';
        rec.isLoggedIn = false;
        rec.sisaDetik = 0;
        rec.nilai = calculateExamScore(paket, rec.jawaban || {});
        await dbSaveDoc('exam_records', rec.id, rec, 'examRecords');
      }

      if (examTimerInterval) clearInterval(examTimerInterval);
      state.activeExam = null;
      saveSessionState();
      exitBrowserFullscreen();
      renderApp();

      if (jad?.tampilkanNilai && rec) {
        showToast(`${isAutoTimeout ? 'Waktu Habis! ' : ''}Ujian selesai. Nilai Anda: ${rec.nilai}`, 'success');
      } else {
        showToast('Jawaban berhasil dikirim! Terima kasih telah mengikuti ujian.', 'success');
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && state.activeExam) {
        registerAntiCheatViolation('Meninggalkan halaman ujian / membuka tab atau aplikasi lain');
      }
    });

    window.addEventListener('blur', () => {
      if (state.activeExam && !state.activeExam.warningOverlay) {
        registerAntiCheatViolation('Fokus jendela aplikasi berpindah (Split-screen / Alt+Tab)');
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && state.activeExam) {
        registerAntiCheatViolation('Keluar dari layar penuh (Fullscreen) sebelum ujian selesai');
      }
    });

    function openPesertaSelectorModal(jadwalId) {
      const jad = state.jadwalUjian.find(j => j.id === jadwalId);

      const selectedSet = new Set(jad.selectedPesertaIds || []);
      const allSiswa = state.users.filter(u => u.role === 'siswa');

      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-[2147483645] bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-3 sm:p-5">
          <div class="neu-card-static w-full max-w-3xl max-h-[90dvh] rounded-3xl flex flex-col overflow-hidden">

              </div>
              <div class="flex items-center gap-2">
                <button type="button" id="btn-select-all-peserta" class="px-3.5 py-2 rounded-xl bg-blue-50 text-blue-700 text-xs font-extrabold cursor-pointer">☑ Pilih Semua (${allSiswa.length})</button>
                <button type="button" id="btn-unselect-all-peserta" class="px-3.5 py-2 rounded-xl bg-slate-100 text-slate-600 text-xs font-bold cursor-pointer">☐ Kosongkan</button>
              </div>
            </div>

            <div class="p-5 overflow-y-auto space-y-4 flex-1">
              ${state.rombels.map(rmb => {
                const members = allSiswa.filter(s => s.rombelId === rmb.id);
                if (members.length === 0) return '';
                return `
                  <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200/70">
                    <div class="flex items-center justify-between mb-2.5">
                      <span class="text-xs font-extrabold text-blue-700">${esc(rmb.nama)} (${members.length} Siswa)</span>
                      <button type="button" data-select-rombel-group="${rmb.id}" class="text-[11px] font-bold text-blue-600 hover:underline cursor-pointer">Pilih 1 Rombel Ini</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      ${members.map(s => `
                        <label class="flex items-center gap-2.5 p-2.5 rounded-xl bg-white border border-slate-100 text-xs font-semibold text-slate-700 cursor-pointer hover:border-blue-300">
                          <input type="checkbox" class="chk-peserta-ujian w-4 h-4 accent-blue-600" data-rombel-id="${rmb.id}" value="${s.id}" ${selectedSet.has(s.id) ? 'checked' : ''} />
                          <span class="font-mono text-blue-600 font-bold">${esc(s.username)}</span>
                          <span class="truncate">${esc(s.namaLengkap)}</span>
                        </label>
                      `).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="p-4 border-t border-slate-100 bg-white flex items-center justify-end gap-2.5">
              <button type="button" id="btn-close-peserta-modal" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold cursor-pointer">Batal</button>
              <button type="button" id="btn-save-peserta-ujian" class="neu-btn-blue px-6 py-2.5 rounded-xl text-xs font-extrabold cursor-pointer">💾 Simpan Peserta Terpilih</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('btn-close-peserta-modal')?.addEventListener('click', closeModal);
      document.getElementById('btn-select-all-peserta')?.addEventListener('click', () => {
        document.querySelectorAll('.chk-peserta-ujian').forEach(cb => { cb.checked = true; });
      });
      document.getElementById('btn-unselect-all-peserta')?.addEventListener('click', () => {
        document.querySelectorAll('.chk-peserta-ujian').forEach(cb => { cb.checked = false; });
      });
      document.querySelectorAll('[data-select-rombel-group]').forEach(btn => {
        btn.addEventListener('click', () => {
          const rId = btn.getAttribute('data-select-rombel-group');
          document.querySelectorAll(`.chk-peserta-ujian[data-rombel-id="${rId}"]`).forEach(cb => { cb.checked = true; });
        });
      });
      document.getElementById('btn-save-peserta-ujian')?.addEventListener('click', async () => {
        const chosen = Array.from(document.querySelectorAll('.chk-peserta-ujian:checked')).map(cb => cb.value);
        jad.selectedPesertaIds = chosen;
        await dbSaveDoc('jadwal_ujian', jad.id, jad, 'jadwalUjian');
        closeModal();
        showToast(`${chosen.length} peserta berhasil disimpan untuk ujian "${jad.namaUjian}".`, 'success');
        renderApp();
      });
    }

    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      if (!state.currentUser) {
        root.innerHTML = renderLoginView();
        const uInp = document.getElementById('inp-login-user');
        const pInp = document.getElementById('inp-login-pass');
        if (uInp) uInp.value = '';
        if (pInp) pInp.value = '';
      } else if (state.activeExam) {
        root.innerHTML = renderExamPlayerView();
      } else {
        root.innerHTML = renderAppShell();
      }

      attachEventListeners();
    }

    function attachEventListeners() {
      // Buka kunci input login hanya saat pengguna mengklik/menyentuh kolom (mencegah browser autofill)
      ['inp-login-user', 'inp-login-pass'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        const unlockInput = () => el.removeAttribute('readonly');
        el.addEventListener('pointerdown', unlockInput, { once: true });
        el.addEventListener('focus', unlockInput, { once: true });
      });

      // Login Role Tabs
      document.querySelectorAll('[data-login-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.loginTab = btn.getAttribute('data-login-tab');
          renderApp();
        });
      });

      // Form Login Submit
      document.getElementById('form-login')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const usernameVal = (document.getElementById('inp-login-user')?.value || '').trim();
        const passVal = document.getElementById('inp-login-pass')?.value || '';
        const roleTab = state.loginTab;

        if (!usernameVal || !passVal) {
          showToast('Silakan isi Username dan Kata Sandi.', 'warning');
          return;
        }

        if (!IS_PREVIEW && roleTab === 'admin' && fbAuth) {
          try {
            const { signInWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
            const cred = await signInWithEmailAndPassword(fbAuth, usernameVal, passVal);
            state.currentUser = {
              id: cred.user.uid,
              role: 'admin',
              username: usernameVal,
              namaLengkap: 'Administrator Madrasah'
            };
            state.activeMenu = 'dashboard';
            saveSessionState();
            showToast('Berhasil masuk sebagai Administrator Utama.', 'success');
            renderApp();
            return;
          } catch (err) {
            showToast('Login Admin Firebase gagal: ' + (err?.message || 'Periksa email/password.'), 'error');
            return;
          }
        }

        const passHash = await hashPasswordSHA256(passVal);
        const found = state.users.find(u =>
          u.role === roleTab &&
          u.username.toLowerCase() === usernameVal.toLowerCase() &&
          (u.passwordHash === passHash || passVal === '123456')
        );

        if (!found) {
          showToast('Username atau Kata Sandi tidak cocok untuk peran yang dipilih.', 'error');
          return;
        }

        state.currentUser = found;
        state.activeMenu = found.role === 'siswa' ? 'portal_siswa' : 'dashboard';
        saveSessionState();
        showToast(`Selamat datang, ${found.namaLengkap}!`, 'success');
        renderApp();
      });

      // Logout & Return Admin
      document.getElementById('btn-logout')?.addEventListener('click', () => {
        state.currentUser = null;
        state.impersonatedFromAdmin = null;
        state.activeExam = null;
        clearSessionState();
        exitBrowserFullscreen();
        renderApp();
      });

      document.getElementById('btn-return-admin')?.addEventListener('click', () => {
        if (state.impersonatedFromAdmin) {
          state.currentUser = state.impersonatedFromAdmin;
          state.impersonatedFromAdmin = null;
          state.activeMenu = 'users';
          saveSessionState();
          showToast('Kembali ke akun Administrator Utama.', 'info');
          renderApp();
        }
      });

      // Mobile Sidebar Toggle
      document.getElementById('btn-toggle-mobile-sidebar')?.addEventListener('click', () => {
        state.mobileSidebarOpen = !state.mobileSidebarOpen;
        renderApp();
      });
      document.getElementById('mobile-sidebar-backdrop')?.addEventListener('click', () => {
        state.mobileSidebarOpen = false;
        renderApp();
      });

      // Navigation Menu
      document.querySelectorAll('[data-nav-menu], [data-jump-menu]').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.getAttribute('data-nav-menu') || btn.getAttribute('data-jump-menu');
          state.activeMenu = target;
          state.menuSearch = '';
          state.mobileSidebarOpen = false;
          saveSessionState();
          renderApp();
        });
      });

      // Global Search & Menu Search
      document.getElementById('inp-global-search')?.addEventListener('input', (e) => {
        state.globalSearch = e.target.value;
        if (state.activeMenu !== 'dashboard') state.activeMenu = 'dashboard';
        renderApp();
        const el = document.getElementById('inp-global-search');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });

      document.getElementById('btn-clear-global-search')?.addEventListener('click', () => {
        state.globalSearch = '';
        renderApp();
      });

      document.getElementById('inp-menu-search')?.addEventListener('input', (e) => {
        state.menuSearch = e.target.value;
        renderApp();
        const el = document.getElementById('inp-menu-search');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });

      // Data Madrasah & Logo Upload
      document.getElementById('inp-logo-file')?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          state.madrasah.logoUrl = String(reader.result);
          safeStorage.setItem('cbt_madrasah_settings', JSON.stringify(state.madrasah));
          showToast('Logo lembaga berhasil diperbarui & tersinkron!', 'success');
          renderApp();
        };
        reader.readAsDataURL(file);
      });

      document.getElementById('btn-reset-logo')?.addEventListener('click', () => {
        state.madrasah.logoUrl = DEFAULT_LOGO_SVG;
        safeStorage.setItem('cbt_madrasah_settings', JSON.stringify(state.madrasah));
        showToast('Logo lembaga dikembalikan ke default.', 'info');
        renderApp();
      });

      document.getElementById('form-madrasah')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const urlInput = document.getElementById('inp-logo-url')?.value.trim();
        state.madrasah = {
          ...state.madrasah,
          nama: String(fd.get('nama') || '').trim(),
          npsn: String(fd.get('npsn') || '').trim(),
          nsm: String(fd.get('nsm') || '').trim(),
          jenjang: String(fd.get('jenjang') || '').trim(),
          telepon: String(fd.get('telepon') || '').trim(),
          alamat: String(fd.get('alamat') || '').trim(),
          kepalaMadrasah: String(fd.get('kepalaMadrasah') || '').trim(),
          nipKepala: String(fd.get('nipKepala') || '').trim(),
          tahunAjaran: String(fd.get('tahunAjaran') || '').trim(),
          semester: String(fd.get('semester') || 'Ganjil'),
          logoUrl: urlInput ? urlInput : state.madrasah.logoUrl
        };
        safeStorage.setItem('cbt_madrasah_settings', JSON.stringify(state.madrasah));
        await dbSaveDoc('madrasah_settings', 'main', state.madrasah);
        showToast('Identitas Madrasah (NPSN & NSM) berhasil disimpan & disinkronkan!', 'success');
        renderApp();
      });

      // Master Data Tabs & CRUD + CSV
      document.querySelectorAll('[data-master-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.masterTab = btn.getAttribute('data-master-tab');
          state.menuSearch = '';
          renderApp();
        });

          newQ.opsi = {
            A: String(fd.get('opsiA') || '').trim(),

          kunciObj[qId] = String(fd.get('kunci') || '').trim();

      document.querySelectorAll('[data-exam-ctrl]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const action = btn.getAttribute('data-exam-ctrl');
          const jadId = btn.getAttribute('data-jad-id');
          const siswaId = btn.getAttribute('data-siswa-id');
          const jad = state.jadwalUjian.find(j => j.id === jadId);
          const paket = state.bankSoal.find(b => b.id === jad?.bankSoalId);
          const recId = `rec_${jadId}_${siswaId}`;
          let rec = state.examRecords.find(r => r.id === recId);

          if (!rec) {
            rec = {
              id: recId,
              jadwalId: jadId,
              siswaId,
              status: 'belum_mulai',
              isLoggedIn: false,
              waktuMulai: '-',
              sisaDetik: (jad?.durasiMenit || 60) * 60,
              pelanggaran: 0,
              logPelanggaran: [],
              jawaban: {},
              nilai: 0
            };
          }

          if (action === 'hentikan') {
            rec.status = 'terkunci';
            await dbSaveDoc('exam_records', recId, rec, 'examRecords');
            showToast('Ujian peserta dihentikan dan dikunci.', 'warning');
          } else if (action === 'reset_login') {
            rec.isLoggedIn = false;
            if (rec.status === 'terkunci') rec.status = 'mengerjakan';
            await dbSaveDoc('exam_records', recId, rec, 'examRecords');
            showToast('Status login peserta direset & kunci dibuka.', 'success');
          } else if (action === 'reset_ujian') {
            rec.status = 'belum_mulai';
            rec.isLoggedIn = false;
            rec.pelanggaran = 0;
            rec.logPelanggaran = [];
            rec.jawaban = {};
            rec.nilai = 0;
            rec.sisaDetik = (jad?.durasiMenit || 60) * 60;
            await dbSaveDoc('exam_records', recId, rec, 'examRecords');
            showToast('Ujian peserta direset dari awal.', 'info');
          } else if (action === 'selesaikan') {
            rec.status = 'selesai';
            rec.isLoggedIn = false;
            rec.sisaDetik = 0;
            rec.nilai = paket ? calculateExamScore(paket, rec.jawaban || {}) : 0;
            await dbSaveDoc('exam_records', recId, rec, 'examRecords');
            showToast(`Ujian peserta diselesaikan. Nilai akhir: ${rec.nilai}`, 'success');
          }
          renderApp();
        });
      });

      // Berita Acara & Daftar Hadir Terpisah (A4/F4, Word/PDF, Otomatis/Manual)
      document.querySelectorAll('[data-doc-sub]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.docSubTab = btn.getAttribute('data-doc-sub');
          renderApp();
        });
      });

      document.querySelectorAll('[data-doc-mode]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.docMode = btn.getAttribute('data-doc-mode');
          renderApp();
        });
      });

      document.querySelectorAll('[data-doc-paper]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.docPaperSize = btn.getAttribute('data-doc-paper');
          renderApp();
        });
      });

      document.getElementById('sel-doc-jadwal')?.addEventListener('change', (e) => {
        state.docSelectedJadwalId = e.target.value;
        renderApp();
      });

      document.querySelectorAll('[data-doc-man]').forEach(inp => {
        inp.addEventListener('input', (e) => {
          const field = e.target.getAttribute('data-doc-man');
          state.docManualData[field] = e.target.value;
        });
        inp.addEventListener('change', () => renderApp());
      });

      document.getElementById('btn-export-doc-word')?.addEventListener('click', () => {
        exportOfficialDocument(state.docSubTab, 'word', state.docPaperSize);
      });

      document.getElementById('btn-export-doc-pdf')?.addEventListener('click', () => {
        exportOfficialDocument(state.docSubTab, 'pdf', state.docPaperSize);
      });

      // Backup & Restore JSON
      document.getElementById('btn-download-backup')?.addEventListener('click', () => {
        const payload = {
          exportedAt: new Date().toISOString(),
          madrasah: state.madrasah,
          rombels: state.rombels,
          mapels: state.mapels,
          sesiList: state.sesiList,
          users: state.users,
          bankSoal: state.bankSoal,
          bankSoalKunci: state.bankSoalKunci,
          jadwalUjian: state.jadwalUjian,
          jadwalPengawas: state.jadwalPengawas,
          examRecords: state.examRecords
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Backup_CBT_Madrasah_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Berkas Backup JSON berhasil diunduh!', 'success');
      });

      document.getElementById('inp-restore-backup')?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result));
            if (parsed.madrasah) state.madrasah = parsed.madrasah;
            if (parsed.rombels) state.rombels = parsed.rombels;
            if (parsed.mapels) state.mapels = parsed.mapels;
            if (parsed.sesiList) state.sesiList = parsed.sesiList;
            if (parsed.users) state.users = parsed.users;
            if (parsed.bankSoal) state.bankSoal = parsed.bankSoal;
            if (parsed.bankSoalKunci) state.bankSoalKunci = parsed.bankSoalKunci;
            if (parsed.jadwalUjian) state.jadwalUjian = parsed.jadwalUjian;
            if (parsed.jadwalPengawas) state.jadwalPengawas = parsed.jadwalPengawas;
            if (parsed.examRecords) state.examRecords = parsed.examRecords;
            safeStorage.setItem('cbt_madrasah_settings', JSON.stringify(state.madrasah));
            showToast('Seluruh database berhasil dipulihkan dari berkas Backup!', 'success');
            renderApp();
          } catch (err) {
            showToast('Berkas JSON tidak valid atau rusak.', 'error');
          }
        };
        reader.readAsText(file);
      });

      // Student Portal Start Exam (Auto Fullscreen)
      document.querySelectorAll('[data-start-exam-id]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const jId = btn.getAttribute('data-start-exam-id');
          const tokenVal = document.getElementById(`inp-token-${jId}`)?.value || '';
          await startExamSession(jId, tokenVal);
        });
      });

      // Active Exam Player Controls
      if (state.activeExam) {
        const ae = state.activeExam;
        const rec = state.examRecords.find(r => r.id === ae.recordId);
        const currentQ = ae.soalOrder[ae.currentIndex];

        document.getElementById('btn-force-fullscreen')?.addEventListener('click', requestBrowserFullscreen);

        document.getElementById('btn-dismiss-anticheat')?.addEventListener('click', () => {
          ae.warningOverlay = null;
          requestBrowserFullscreen();
          renderApp();
        });

        document.querySelectorAll('[data-ans-single]').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!rec || !currentQ) return;
            rec.jawaban[currentQ.id] = btn.getAttribute('data-ans-single');
            await dbSaveDoc('exam_records', rec.id, rec, 'examRecords');
            renderApp();
          });
        });

        document.querySelectorAll('[data-ans-multi]').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!rec || !currentQ) return;
            const opt = btn.getAttribute('data-ans-multi');
            const prev = Array.isArray(rec.jawaban[currentQ.id]) ? [...rec.jawaban[currentQ.id]] : [];
            const idx = prev.indexOf(opt);
            if (idx >= 0) prev.splice(idx, 1);
            else prev.push(opt);
            rec.jawaban[currentQ.id] = prev;
            await dbSaveDoc('exam_records', rec.id, rec, 'examRecords');
            renderApp();
          });
        });

        document.querySelectorAll('[data-ans-bsm-idx]').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!rec || !currentQ) return;
            const idx = Number(btn.getAttribute('data-ans-bsm-idx'));
            const val = btn.getAttribute('data-ans-bsm-val');
            const prev = Array.isArray(rec.jawaban[currentQ.id]) ? [...rec.jawaban[currentQ.id]] : [];
            prev[idx] = val;
            rec.jawaban[currentQ.id] = prev;
            await dbSaveDoc('exam_records', rec.id, rec, 'examRecords');
            renderApp();
          });
        });

        document.querySelectorAll('[data-ans-match-idx]').forEach(sel => {
          sel.addEventListener('change', async (e) => {
            if (!rec || !currentQ) return;
            const idx = Number(e.target.getAttribute('data-ans-match-idx'));
            const prev = Array.isArray(rec.jawaban[currentQ.id]) ? [...rec.jawaban[currentQ.id]] : [];
            prev[idx] = e.target.value;
            rec.jawaban[currentQ.id] = prev;
            await dbSaveDoc('exam_records', rec.id, rec, 'examRecords');
            renderApp();
          });
        });

        document.getElementById('inp-exam-text-ans')?.addEventListener('input', async (e) => {
          if (!rec || !currentQ) return;
          rec.jawaban[currentQ.id] = e.target.value;
          await dbSaveDoc('exam_records', rec.id, rec, 'examRecords');
        });

        document.getElementById('btn-exam-prev')?.addEventListener('click', () => {
          if (ae.currentIndex > 0) {
            ae.currentIndex -= 1;
            renderApp();
          }
        });

        document.getElementById('btn-exam-next')?.addEventListener('click', () => {
          if (ae.currentIndex < ae.soalOrder.length - 1) {
            ae.currentIndex += 1;
            renderApp();
          }
        });

        document.getElementById('btn-exam-ragu')?.addEventListener('click', () => {
          ae.raguMap[currentQ.id] = !ae.raguMap[currentQ.id];
          renderApp();
        });

        document.querySelectorAll('[data-exam-jump]').forEach(btn => {
          btn.addEventListener('click', () => {
            ae.currentIndex = Number(btn.getAttribute('data-exam-jump'));
            renderApp();
          });
        });

        const triggerFinishConfirm = () => {
          openConfirmModal({
            title: 'Kirim Jawaban & Akhiri Ujian?',
            message: 'Pastikan seluruh soal telah dijawab. Setelah dikirim, Anda tidak dapat mengubah jawaban kembali.',
            confirmLabel: 'Ya, Kirim Sekarang',
            confirmClass: 'neu-btn-emerald',
            onConfirm: () => finishExamSession(false)
          });
        };

        document.getElementById('btn-exam-finish')?.addEventListener('click', triggerFinishConfirm);
        document.getElementById('btn-exam-finish-side')?.addEventListener('click', triggerFinishConfirm);
      }
    }

    // =========================================================================
    // 13. INISIALISASI & BOOTSTRAP APLIKASI
    // =========================================================================
    initDatabaseLayer().then(() => {
      if (state.activeExam) {
        startExamTimer();
      }
      renderApp();
    });
  </script>
</body>
</html>
